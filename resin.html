<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Смола — Планировщик</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f4f6f9; padding: 16px; min-height: 100vh; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; }
        .header { margin-bottom: 16px; }
        .header h1 { font-size: 22px; font-weight: 600; color: #1a1a2e; }
        .header p { font-size: 14px; color: #888; }
        .nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; background: white; padding: 8px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .nav a { padding: 6px 12px; background: #eef1f4; border-radius: 16px; text-decoration: none; font-size: 12px; color: #555; font-weight: 500; }
        .nav a:hover { background: #dce0e4; }
        .nav a.active { background: #2c3e50; color: white; }
        .card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eaeef2; }
        .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: #1a1a2e; }
        .field { margin-bottom: 10px; }
        .field label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 4px; }
        .field select, .field input { width: 100%; padding: 10px 12px; border: 1.5px solid #dce0e5; border-radius: 8px; font-size: 15px; background: #fafbfc; }
        .btn { padding: 8px 16px; background: #2c3e50; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #1a252f; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn-success { background: #27ae60; }
        .btn-success:hover { background: #1e8449; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-warning:hover { background: #d68910; }
        .badge { display: inline-block; padding: 3px 12px; border-radius: 16px; font-size: 12px; font-weight: 500; }
        .badge-waiting { background: #fff3cd; color: #856404; }
        .badge-work { background: #cce5ff; color: #004085; }
        .badge-shelf { background: #e8daef; color: #6c3483; }
        .badge-done { background: #d4edda; color: #155724; }
        .item { padding: 12px 0; border-bottom: 1px solid #f0f2f5; }
        .item:last-child { border-bottom: none; }
        .item .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .item .order-num { font-weight: 600; font-size: 15px; color: #1a1a2e; }
        .item .order-meta { font-size: 14px; color: #666; }
        .item .actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .shelf-select { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .shelf-select select { padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
        .shelf-select input { width: 60px; padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; text-align: center; }
        .msg { padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .empty { text-align: center; padding: 28px 0; color: #aaa; font-size: 14px; }
        .loading { text-align: center; padding: 16px 0; color: #999; font-size: 14px; }
        .split-section { background: #fef9e7; border: 1px solid #f9e79f; border-radius: 8px; padding: 10px; margin-top: 6px; }
        .split-section label { font-size: 12px; color: #666; }
        .split-row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 4px 0; }
        .split-row select { padding: 3px 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
        .split-row input { width: 50px; padding: 3px 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; text-align: center; }
        .split-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
        .suggested { background: #eafaf1; border-left: 3px solid #27ae60; padding: 6px 10px; border-radius: 4px; font-size: 13px; color: #1a7a42; margin: 4px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
        .suggested strong { font-weight: 600; }
        @media (max-width: 480px) {
            body { padding: 12px; }
            .card { padding: 14px; }
            .nav a { font-size: 11px; padding: 5px 10px; }
            .shelf-select { flex-direction: column; align-items: stretch; }
            .split-row { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Смола</h1>
        <p>Заказы на заливку</p>
    </div>

    <div class="nav">
        <a href="/planner-app/">Главная</a>
        <a href="/planner-app/prep.html">Подготовка</a>
        <a href="/planner-app/print.html">Печать</a>
        <a href="/planner-app/cutter.html">Каттер</a>
        <a href="/planner-app/cutting.html">Раскрой</a>
        <a href="/planner-app/resin.html" class="active">Смола</a>
        <a href="/planner-app/drying.html">Сушка</a>
        <a href="/planner-app/otk.html">ОТК</a>
        <a href="/planner-app/packing.html">Упаковка</a>
    </div>

    <div id="message" class="msg"></div>

    <div class="card">
        <h3>Заказы на смоле</h3>
        <div id="resinList"></div>
        <button class="btn" style="width:100%; margin-top:10px; background:#eef1f4; color:#333;" onclick="loadResinOrders()">Обновить</button>
    </div>
</div>

<script>
    var API_URL = 'https://script.google.com/macros/s/AKfycbxa8Ag_VFouB9IITEXP0XlcMtVMsG-MgeheLC3f38x_TDnLqpQGy7OmvyPxTPAcueFbcw/exec';

    function showMessage(text, type) {
        var el = document.getElementById('message');
        el.textContent = text;
        el.className = 'msg show ' + type;
        setTimeout(function() {
            el.classList.remove('show');
        }, 5000);
    }

    function getSuggestedSplits(totalBlocks) {
        var splits = [];
        var remaining = totalBlocks;
        var maxPerShelf = 46;
        var shelves = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
        var shelfIndex = 0;
        while (remaining > 0) {
            var blocks = Math.min(remaining, maxPerShelf);
            splits.push({ shelf: shelves[shelfIndex % shelves.length], blocks: blocks });
            remaining -= blocks;
            shelfIndex++;
        }
        return splits;
    }

    function loadResinOrders() {
        var container = document.getElementById('resinList');
        container.innerHTML = '<div class="loading">Загрузка...</div>';

        fetch(API_URL + '?action=getResinOrders&_=' + Date.now())
            .then(function(response) {
                return response.json();
            })
            .then(function(result) {
                if (result.error) {
                    container.innerHTML = '<div class="empty">Ошибка: ' + result.error + '</div>';
                    return;
                }
                if (!result.data || result.data.length === 0) {
                    container.innerHTML = '<div class="empty">Нет заказов на смоле</div>';
                    return;
                }
                var html = '';
                for (var i = 0; i < result.data.length; i++) {
                    var item = result.data[i];
                    var badgeClass = '';
                    var statusText = item.status || 'Ожидание';
                    if (statusText === 'Ожидание') badgeClass = 'badge-waiting';
                    else if (statusText === 'В работе') badgeClass = 'badge-work';
                    else if (statusText === 'Готов к сушке') badgeClass = 'badge-shelf';
                    else if (statusText === 'Выполнено') badgeClass = 'badge-done';

                    html += '<div class="item" data-order="' + item.order + '">';
                    html += '  <div class="head">';
                    html += '    <span class="order-num">' + item.order + '</span>';
                    html += '    <span class="badge ' + badgeClass + '">' + statusText + '</span>';
                    html += '  </div>';
                    html += '  <div class="order-meta">Блоков: ' + item.blocks + ' | Стеллаж: ' + (item.shelf || '—') + '</div>';
                    html += '  <div class="actions">';

                    // ==========================================
                    // СТАТУС: ОЖИДАНИЕ
                    // ==========================================
                    if (statusText === 'Ожидание') {
                        html += '    <button class="btn btn-sm btn-success" onclick="updateResinOrder(\'' + item.order + '\', \'В работе\')">Взять в работу</button>';
                    }

                    // ==========================================
// СТАТУС: В РАБОТЕ
// ==========================================
if (statusText === 'В работе') {
    // ЕСЛИ БЛОКОВ МЕНЬШЕ ИЛИ РАВНО 46 — ПОКАЗЫВАЕМ ОБЫЧНОЕ НАЗНАЧЕНИЕ
    if (item.blocks <= 46) {
        html += '    <div class="shelf-select">';
        html += '      <select id="shelf-' + item.order + '">';
        for (var s = 65; s <= 72; s++) { var letter = String.fromCharCode(s); html += '<option value="' + letter + '">' + letter + '</option>'; }
        html += '      </select>';
        html += '      <input type="number" id="blocks-' + item.order + '" value="' + item.blocks + '" min="1" max="' + item.blocks + '">';
        html += '      <button class="btn btn-sm btn-success" onclick="assignShelf(\'' + item.order + '\')">Назначить</button>';
        html += '    </div>';
    }

    // Разделение (если > 46)
    if (item.blocks > 46) {
        // ... (весь ваш старый код разделения оставляем как есть внутри этого блока if)
        var suggested = getSuggestedSplits(item.blocks);
        // ... и так далее до конца блока разделения

                    // ==========================================
                    // СТАТУС: ГОТОВ К СУШКЕ
                    // ==========================================
                    if (statusText === 'Готов к сушке') {
                        html += '    <button class="btn btn-sm btn-danger" onclick="updateResinOrder(\'' + item.order + '\', \'Выполнено\')">Завершить</button>';
                    }

                    html += '  </div>';
                    html += '</div>';
                }
                container.innerHTML = html;
            })
            .catch(function(err) {
                container.innerHTML = '<div class="empty">Ошибка: ' + err.message + '</div>';
            });
    }

    function applySuggestedSplit(orderNumber, totalBlocks) {
        var suggested = getSuggestedSplits(totalBlocks);
        var container = document.getElementById('split-container-' + orderNumber);
        container.innerHTML = '';
        for (var i = 0; i < suggested.length; i++) {
            var row = document.createElement('div');
            row.className = 'split-row';
            row.id = 'split-row-' + (i+1) + '-' + orderNumber;
            var select = document.createElement('select');
            select.id = 'split-shelf-' + (i+1) + '-' + orderNumber;
            for (var s = 65; s <= 72; s++) {
                var letter = String.fromCharCode(s);
                var option = document.createElement('option');
                option.value = letter;
                option.textContent = letter;
                if (letter === suggested[i].shelf) option.selected = true;
                select.appendChild(option);
            }
            row.appendChild(select);
            var input = document.createElement('input');
            input.type = 'number';
            input.id = 'split-blocks-' + (i+1) + '-' + orderNumber;
            input.value = suggested[i].blocks;
            input.min = 1;
            input.max = 46;
            input.style.width = '50px';
            input.style.padding = '3px 6px';
            input.style.border = '1px solid #ddd';
            input.style.borderRadius = '4px';
            input.style.textAlign = 'center';
            row.appendChild(input);
            container.appendChild(row);
        }
        showMessage('Предложенное разделение применено', 'ok');
    }

    function addSplitRow(orderNumber) {
        var container = document.getElementById('split-container-' + orderNumber);
        var rowCount = container.children.length + 1;
        var newRow = document.createElement('div');
        newRow.className = 'split-row';
        newRow.id = 'split-row-' + rowCount + '-' + orderNumber;
        var select = document.createElement('select');
        select.id = 'split-shelf-' + rowCount + '-' + orderNumber;
        for (var s = 65; s <= 72; s++) {
            var letter = String.fromCharCode(s);
            var option = document.createElement('option');
            option.value = letter;
            option.textContent = letter;
            select.appendChild(option);
        }
        newRow.appendChild(select);
        var input = document.createElement('input');
        input.type = 'number';
        input.id = 'split-blocks-' + rowCount + '-' + orderNumber;
        input.value = 46;
        input.min = 1;
        input.max = 46;
        input.style.width = '50px';
        input.style.padding = '3px 6px';
        input.style.border = '1px solid #ddd';
        input.style.borderRadius = '4px';
        input.style.textAlign = 'center';
        newRow.appendChild(input);
        container.appendChild(newRow);
    }

    // ============================================================
    // POST-ЗАПРОСЫ
    // ============================================================
    function splitOrder(orderNumber) {
        var container = document.getElementById('split-container-' + orderNumber);
        var rows = container.children;
        var splits = [];
        var sum = 0;
        for (var i = 0; i < rows.length; i++) {
            var shelf = document.getElementById('split-shelf-' + (i+1) + '-' + orderNumber).value;
            var blocks = parseInt(document.getElementById('split-blocks-' + (i+1) + '-' + orderNumber).value) || 0;
            if (blocks > 0) { splits.push({ shelf: shelf, blocks: blocks }); sum += blocks; }
        }
        if (splits.length === 0) { showMessage('Добавьте хотя бы один стеллаж', 'err'); return; }
        for (var i = 0; i < splits.length; i++) {
            if (splits[i].blocks > 46) {
                showMessage('Стеллаж ' + splits[i].shelf + ' (' + splits[i].blocks + ' блоков) превышает лимит 46', 'err');
                return;
            }
        }
        var data = { action: 'splitShelf', orderNumber: orderNumber, splits: splits };
        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
            .then(function() { showMessage('Заказ разделён', 'ok'); loadResinOrders(); })
            .catch(function(err) { showMessage('Ошибка: ' + err.message, 'err'); });
    }

    function assignShelf(orderNumber) {
        var shelf = document.getElementById('shelf-' + orderNumber).value;
        var blocks = parseInt(document.getElementById('blocks-' + orderNumber).value) || 0;
        if (blocks > 46) { showMessage('На один стеллаж максимум 46 блоков', 'err'); return; }
        var data = { action: 'assignShelf', orderNumber: orderNumber, shelf: shelf, blocks: blocks };
        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
            .then(function() { showMessage('Заказ назначен на стеллаж ' + shelf, 'ok'); loadResinOrders(); })
            .catch(function(err) { showMessage('Ошибка: ' + err.message, 'err'); });
    }

    function updateResinOrder(orderNumber, newStatus) {
        var data = { action: 'updateResinStatus', orderNumber: orderNumber, status: newStatus };
        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
            .then(function() { showMessage('Статус обновлён', 'ok'); loadResinOrders(); })
            .catch(function(err) { showMessage('Ошибка: ' + err.message, 'err'); });
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadResinOrders();
    });
</script>

</body>
</html>
