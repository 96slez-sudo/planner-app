<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Смола</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Science Gothic', sans-serif; 
            background: #ffffff; 
            color: #161616; 
            padding: 16px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
        }
        a { text-decoration: none; }

        .container { max-width: 1520px; width: 100%; }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid #eeeeee;
        }
        .header .title { font-size: 20px; letter-spacing: 0.5px; color: #161616; }
        .header .subtitle { font-size: 16px; color: #161616; cursor: pointer; transition: 0.2s; }
        .header .subtitle:hover { opacity: 0.7; }

        .stages {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 40px;
        }
        .stage-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            background: #cdcdcd;
            border-radius: 8px;
            color: #141414;
            font-size: 18px;
            transition: 0.2s;
        }
        .stage-btn:hover { background: #b0b0b0; }
        .stage-btn.active { background: #1e1e1e; color: #ffffff; }

        .page-title { font-size: 32px; margin-bottom: 24px; color: #161616; }
        
        .order-card {
            display: flex;
            flex-wrap: wrap; 
            align-items: center;
            gap: 16px 24px;
            padding: 8px 0;
            border-bottom: 1px solid #eeeeee;
        }
        .order-card:last-child { border-bottom: none; }

        .col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-shrink: 0;
        }
        .col .label { font-size: 18px; color: #161616; white-space: nowrap; }
        .col .value {
            display: flex;
            align-items: center;
            padding: 0 12px;
            border: 1px solid #6c6c6c;
            border-radius: 8px;
            font-family: 'Science Gothic', sans-serif;
            font-size: 15px;
            background: #fff;
            height: 40px;
            width: 100%;
            white-space: nowrap;
        }

        .col-order { width: 160px; }
        .col-roll { width: 180px; }
        .col-blocks { width: 140px; }
        .col-status { width: 200px; }
        .col-actions { width: 160px; }

        .status-wait { background: #e0e0e0 !important; border-color: #b0b0b0 !important; color: #555 !important; }
        .status-work { background: #ffe066 !important; border-color: #d4b300 !important; color: #1a1a1a !important; }

        .btn-green {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            height: 40px;
            width: 160px;
            background-color: #0f8653;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-green:hover { opacity: 0.8; }

        /* ===== ПАНЕЛЬ ВЫБОРА СТЕЛЛАЖЕЙ ===== */
        .shelf-panel {
            width: 100%;
            padding-top: 12px;
            margin-top: 4px;
            border-top: 1px solid #eeeeee;
        }
        .shelf-title-row { margin-bottom: 12px; }
        .shelf-title-row h4 { font-size: 20px; font-weight: 400; color: #161616; }

        .shelf-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        .shelf-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            background: #ffffff; /* ВСЕ СВОБОДНЫЕ СТЕЛЛАЖИ БЕЛЫЕ */
            min-height: 48px;
            transition: border-color 0.2s;
        }
        /* Когда стеллаж выбран (клик по букве) - рамка становится зеленой */
        .shelf-item.selected-shelf {
            border-color: #0f8653;
            border-width: 2px;
            box-shadow: 0 0 0 1px #0f8653;
        }

        /* Цвета стеллажей */
        .shelf-item.state-grey { 
            background-color: #a0a0a0; 
            border-color: #888; 
        }
        .shelf-item.state-grey .state-text { color: #444; }
        .shelf-item.state-grey .input-blocks { background: #e0e0e0; border-color: #aaa; color: #666; }

        /* БУКВЫ СТЕЛЛАЖЕЙ (меняют цвет, а не фон карточки) */
        .letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        
        .letter.state-green { background-color: #1e8449; color: #fff; }
        .letter.state-yellow { background-color: #ffd966; color: #161616; }
        .letter.state-grey { background-color: #777; color: #fff; cursor: not-allowed; }

        /* При выборе зеленая заливка */
        .letter.selected {
            background-color: #0f8653 !important;
            color: #ffffff !important;
        }

        .state-text {
            flex: 1;
            font-size: 14px;
            color: #161616;
        }
        .state-grey .state-text { opacity: 0.7; }

        .input-blocks {
            width: 44px;
            height: 28px;
            padding: 2px;
            border: 1px solid #6c6c6c;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
            font-family: 'Science Gothic', sans-serif;
            background: #fff;
            flex-shrink: 0;
        }

        .bottom-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
        }
        .btn-auto {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            height: 40px;
            background-color: #0f8653;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-auto:hover { opacity: 0.8; }
        .btn-assign {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 32px;
            height: 40px;
            background-color: #e74c3c;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-assign:hover { opacity: 0.8; }

        .btn-refresh {
            width: 100%;
            padding: 12px;
            background: #eef1f4;
            border-radius: 8px;
            color: #333;
            font-size: 14px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-refresh:hover { background: #dce0e4; }

        .msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @media (max-width: 992px) {
            .col-order, .col-roll, .col-blocks, .col-status, .col-actions { width: 100%; max-width: 100%; flex: 1 1 100%; }
            .btn-green, .btn-auto, .btn-assign { width: 100%; }
            .shelf-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .header .title { font-size: 16px; }
            .header .subtitle { font-size: 14px; }
            .stage-btn { font-size: 14px; padding: 6px 12px; }
            .page-title { font-size: 26px; }
            .shelf-title-row h4 { font-size: 18px; }
            .shelf-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .col .label { font-size: 16px; }
            .col .value { font-size: 13px; height: 32px; }
            .btn-auto, .btn-assign { height: 32px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">//ПЛАНИРОВЩИК ПРОИЗВОДСТВА</div>
        <a href="/planner-app/" class="subtitle">ГЛАВНАЯ//</a>
    </div>
    <div id="message" class="msg"></div>

    <div class="stages">
        <a href="/planner-app/create.html" class="stage-btn">Создание заказа</a>
        <a href="/planner-app/prep.html" class="stage-btn">Подготовка</a>
        <a href="/planner-app/print.html" class="stage-btn">Печать</a>
        <a href="/planner-app/cutter.html" class="stage-btn">Каттер</a>
        <a href="/planner-app/cutting.html" class="stage-btn">Раскрой</a>
        <a href="/planner-app/resin.html" class="stage-btn active">Смола</a>
        <a href="/planner-app/drying.html" class="stage-btn">Сушка</a>
        <a href="/planner-app/otk.html" class="stage-btn">ОТК</a>
        <a href="/planner-app/packing.html" class="stage-btn">Упаковка</a>
    </div>

    <div class="page-title">Очередь на смолы</div>
    <div id="resinList">
        <div style="text-align: center; padding: 40px 0; color: #999;">Загрузка заказов...</div>
    </div>
    <button class="btn-refresh" onclick="loadResinOrders()">Обновить</button>
</div>

<script>
    const SUPABASE_URL = 'https://knuqfyjdptkkdapivsnm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6k1bwNvlNAjNYI9NrijXtg_clTUDrOJ';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type) {
        var el = document.getElementById('message');
        el.textContent = text;
        el.className = 'msg show ' + type;
        setTimeout(function() { el.classList.remove('show'); }, 5000);
    }

    /* ============================================================
       ФУНКЦИЯ ОТРИСОВКИ ПАНЕЛИ СТЕЛЛАЖЕЙ ДЛЯ КОНКРЕТНОГО РУЛОНА
       ============================================================ */
    async function renderShelfPanel(stageId, orderNumber, totalBlocks) {
        const { data: drying, error } = await supabaseClient
            .from('stages')
            .select('shelf, blocks')
            .eq('stage', 'Сушка')
            .in('status', ['Ожидание', 'В работе']);

        const shelfUsage = {
            'A': 0, 'B': 0, 'C': 0, 'D': 0,
            'E': 0, 'F': 0, 'G': 0, 'H': 0
        };
        
        if (drying && !error) {
            drying.forEach(item => {
                const s = item.shelf;
                if (shelfUsage[s] !== undefined) {
                    shelfUsage[s] += (item.blocks || 0);
                }
            });
        }

        const letters = ['A','B','C','D','E','F','G','H'];
        let html = `
            <div class="shelf-panel" id="panel-${stageId}">
                <div class="shelf-title-row">
                    <h4>Назначьте стеллаж</h4>
                </div>
                <div class="shelf-grid" id="grid-${stageId}">
        `;

        for (let l of letters) {
            const currentBlocks = shelfUsage[l] || 0;
            const freeBlocks = 46 - currentBlocks;
            
            let itemClass = '';
            let letterClass = 'state-green';
            let stateText = `Свободен (${freeBlocks})`;
            let inputDisabled = false;
            let letterClickable = true;

            if (currentBlocks === 46) {
                itemClass = 'state-grey';
                letterClass = 'state-grey';
                stateText = 'Занят';
                inputDisabled = true;
                letterClickable = false;
            } else if (currentBlocks > 0 && currentBlocks < 46) {
                letterClass = 'state-yellow';
            }

            html += `
                <div class="shelf-item ${itemClass}" id="shelf-${stageId}-${l}">
                    <div class="letter ${letterClass}" id="letter-${stageId}-${l}" data-stage="${stageId}" data-shelf="${l}" onclick="${letterClickable ? `selectShelf('${stageId}', '${l}')` : ''}" style="${!letterClickable ? 'cursor:not-allowed;' : ''}">
                        ${l}
                    </div>
                    <span class="state-text">${stateText}</span>
                    <input type="number" class="input-blocks" id="input-${stageId}-${l}" min="1" max="${freeBlocks}" placeholder="0" value="" ${inputDisabled ? 'disabled' : ''} />
                </div>
            `;
        }

        html += `
                </div>
                <div class="bottom-actions">
                    <button class="btn-auto" onclick="autoAssign('${stageId}', ${totalBlocks})">Распределить автоматически</button>
                    <button class="btn-assign" onclick="manualAssignAndFinish('${stageId}')">Назначить и завершить</button>
                </div>
            </div>
        `;
        return html;
    }

    function selectShelf(stageId, shelf) {
        const panel = document.getElementById(`panel-${stageId}`);
        const letter = panel.querySelector(`#letter-${stageId}-${shelf}`);
        if (!letter) return;
        letter.classList.toggle('selected');
        
        const shelfItem = letter.closest('.shelf-item');
        if(shelfItem) shelfItem.classList.toggle('selected-shelf');
    }

    async function autoAssign(stageId, totalBlocks) {
        const panel = document.getElementById(`panel-${stageId}`);
        const letters = panel.querySelectorAll('.letter');
        
        letters.forEach(el => el.classList.remove('selected'));
        panel.querySelectorAll('.shelf-item').forEach(el => el.classList.remove('selected-shelf'));
        panel.querySelectorAll('.input-blocks').forEach(inp => inp.value = '');

        let remaining = totalBlocks;
        let assignedCount = 0;

        for (let el of letters) {
            if (remaining <= 0) break;
            
            const shelfItem = el.closest('.shelf-item');
            if (!shelfItem) continue;
            if (shelfItem.classList.contains('state-grey')) continue;

            const input = shelfItem.querySelector('.input-blocks');
            if (!input || input.disabled) continue;
            
            const maxBlocks = parseInt(input.max) || 0;
            if (maxBlocks === 0) continue;

            const take = Math.min(remaining, maxBlocks);
            if (take > 0) {
                el.classList.add('selected');
                shelfItem.classList.add('selected-shelf');
                input.value = take;
                remaining -= take;
                assignedCount++;
            }
        }

        if (remaining > 0) {
            showMessage(`Не хватает свободных мест на стеллажах! Не хватает ${remaining} блоков.`, 'err');
            return;
        }

        showMessage(`Стеллажи распределены автоматически (${assignedCount} стеллажей).`, 'ok');
    }

    async function manualAssignAndFinish(stageId) {
        const panel = document.getElementById(`panel-${stageId}`);
        const letters = panel.querySelectorAll('.letter.selected');
        const assignments = [];

        let totalAssigned = 0;
        for (let el of letters) {
            const shelf = el.dataset.shelf;
            const shelfItem = el.closest('.shelf-item');
            const input = shelfItem.querySelector('.input-blocks');
            const blocks = parseInt(input?.value) || 0;
            if (blocks > 0) {
                assignments.push({ shelf, blocks });
                totalAssigned += blocks;
            }
        }

        if (assignments.length === 0) {
            showMessage('Выберите хотя бы один стеллаж (нажмите на букву) и укажите кол-во блоков.', 'err');
            return;
        }

        const { data: stageData, error: getError } = await supabaseClient
            .from('stages')
            .select('order_number, blocks')
            .eq('id', stageId)
            .single();

        if (getError || !stageData) {
            showMessage('Ошибка получения заказа', 'err');
            return;
        }

        for (let a of assignments) {
            await supabaseClient
                .from('stages')
                .insert([
                    { 
                        order_number: stageData.order_number, 
                        stage: 'Сушка', 
                        status: 'Ожидание', 
                        shelf: a.shelf, 
                        blocks: a.blocks 
                    }
                ]);
        }

        await supabaseClient
            .from('stages')
            .update({ status: 'Выполнено' })
            .eq('id', stageId);

        const { count, error: countError } = await supabaseClient
            .from('stages')
            .select('*', { count: 'exact', head: true })
            .eq('order_number', stageData.order_number)
            .eq('stage', 'Смола')
            .neq('status', 'Выполнено');

        if (countError) {
            showMessage('Ошибка подсчёта рулонов', 'err');
            return;
        }

        if (count === 0) {
            await supabaseClient
                .from('orders')
                .update({ stage: 'Сушка' })
                .eq('order_number', stageData.order_number);
            showMessage(`Последний рулон завершён! Весь заказ переведён на Сушку`, 'ok');
        } else {
            showMessage(`Рулон назначен на стеллаж. Осталось ещё ${count} рулон(ов) на смоле.`, 'ok');
        }

        loadResinOrders();
    }

    async function startResin(stageId) {
        const { error } = await supabaseClient
            .from('stages')
            .update({ status: 'В работе' })
            .eq('id', stageId);
            
        if (error) showMessage('Ошибка: ' + error.message, 'err');
        else showMessage('Рулон взят в работу', 'ok');
        loadResinOrders();
    }

    async function loadResinOrders() {
        const container = document.getElementById('resinList');
        container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Загрузка...</div>';

        const { data: stages, error: stageError } = await supabaseClient
            .from('stages')
            .select('*')
            .eq('stage', 'Смола')
            .in('status', ['Ожидание', 'Ожидает', 'В работе']);

        if (stageError) {
            container.innerHTML = `<div style="text-align: center; padding: 40px 0; color: #c0392b;">Ошибка: ${stageError.message}</div>`;
            return;
        }
        if (!stages || stages.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Нет рулонов на смоле</div>';
            return;
        }

        const sorted = [...stages].sort((a, b) => {
            if (a.status === 'Ожидание' && b.status !== 'Ожидание') return -1;
            if (a.status !== 'Ожидание' && b.status === 'Ожидание') return 1;
            return 0;
        });

        let html = '';
        for (let item of sorted) {
            const orderNumber = item.order_number;
            const blocks = item.blocks || 0;
            const rollId = item.shelf || '—';
            const status = item.status;

            let statusClass = 'status-wait';
            let statusText = 'Ожидает';
            if (status === 'В работе') { 
                statusClass = 'status-work'; 
                statusText = 'В работе'; 
            }

            html += `
                <div class="order-card">
                    <div class="col col-order">
                        <div class="label">№ заказа</div>
                        <div class="value">${orderNumber}</div>
                    </div>
                    <div class="col col-roll">
                        <div class="label">ID рулона</div>
                        <div class="value">${rollId}</div>
                    </div>
                    <div class="col col-blocks">
                        <div class="label">Кол-во блоков</div>
                        <div class="value">${blocks}</div>
                    </div>
                    <div class="col col-status">
                        <div class="label">Статус</div>
                        <div class="value ${statusClass}">${statusText}</div>
                    </div>
                    <div class="col col-actions">
                        <div class="label">&nbsp;</div>
                        ${status === 'Ожидание' || status === 'Ожидает'
                            ? `<button class="btn-green" onclick="startResin('${item.id}')">Взять в работу</button>`
                            : ``
                        }
                    </div>
                </div>
            `;

            if (status === 'В работе') {
                html += await renderShelfPanel(item.id, orderNumber, blocks);
            }
        }
        container.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', loadResinOrders);
</script>
</body>
</html>
