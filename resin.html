<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Смола — Планировщик</title>
    <style>
        /* ... (стили как в предыдущей версии) ... */
    </style>
</head>
<body>
<!-- ... (шапка и навигация как в предыдущей версии) ... -->

<div class="card">
    <h3>Заказы на смоле</h3>
    <div id="resinList"></div>
    <button class="btn" style="width:100%; margin-top:10px; background:#eef1f4; color:#333;" onclick="loadResinOrders()">Обновить</button>
</div>

<script>
    const API_URL = '...';

    function showMessage(text, type) { ... }

    function loadResinOrders() {
        var container = document.getElementById('resinList');
        container.innerHTML = '<div class="loading">Загрузка...</div>';

        // Загружаем свободные стеллажи
        fetch(API_URL + '?action=getAvailableShelves&_=' + Date.now())
        .then(function(response) { return response.json(); })
        .then(function(shelfResult) {
            if (shelfResult.data) {
                availableShelves = shelfResult.data;
            }
            return fetch(API_URL + '?action=getResinOrders&_=' + Date.now());
        })
        .then(function(response) { return response.json(); })
        .then(function(result) {
            if (result.error) {
                container.innerHTML = '<div class="empty">Ошибка: ' + result.error + '</div>';
                return;
            }
            if (!result.data || result.data.length === 0) {
                container.innerHTML = '<div class="empty">Нет заказов на смоле</div>';
                return;
            }
            var html = '';
            result.data.forEach(function(item) {
                var badgeClass = '';
                var statusText = item.status || 'Ожидание';
                if (statusText === 'Ожидание') badgeClass = 'badge-waiting';
                else if (statusText === 'В работе') badgeClass = 'badge-work';
                else if (statusText === 'Готов к сушке') badgeClass = 'badge-shelf';
                else if (statusText === 'Выполнено') badgeClass = 'badge-done';

                html += '<div class="item">';
                html += '  <div class="head">';
                html += '    <span class="order-num">№ ' + item.order + '</span>';
                html += '    <span class="badge ' + badgeClass + '">' + statusText + '</span>';
                html += '  </div>';
                html += '  <div class="order-meta">Блоков: ' + item.blocks + ' | Стеллаж: ' + (item.shelf || '—') + '</div>';
                html += '  <div class="actions">';
                
                // 1. Ожидание → "Взять в работу"
                if (statusText === 'Ожидание') {
                    html += '    <button class="btn btn-sm btn-success" onclick="updateResinOrder(\'' + item.order + '\', \'В работе\')">Взять в работу</button>';
                }
                
                // 2. В работе → выбор стеллажа
                if (statusText === 'В работе') {
                    var available = availableShelves.filter(function(s) { return s.free > 0; });
                    
                    if (available.length === 0) {
                        html += '    <div style="color:#e74c3c; font-size:13px; padding:4px 0;">Нет свободных стеллажей!</div>';
                    } else {
                        html += '    <div class="shelf-select">';
                        html += '      <select id="shelf-' + item.order + '">';
                        for (var i = 0; i < available.length; i++) {
                            var s = available[i];
                            html += '<option value="' + s.shelf + '">' + s.shelf + ' (свободно ' + s.free + ')' + '</option>';
                        }
                        html += '      </select>';
                        html += '      <input type="number" id="blocks-' + item.order + '" value="' + Math.min(item.blocks, 46) + '" min="1" max="' + Math.min(item.blocks, 46) + '">';
                        html += '      <button class="btn btn-sm btn-success" onclick="assignShelf(\'' + item.order + '\')">Назначить</button>';
                        html += '    </div>';
                    }
                    
                    if (item.blocks > 46 && available.length > 1) {
                        // ... блок разделения ...
                    }
                }
                
                // 3. Готов к сушке → только "Завершить"
                if (statusText === 'Готов к сушке') {
                    html += '    <button class="btn btn-sm btn-danger" onclick="updateResinOrder(\'' + item.order + '\', \'Выполнено\')">Завершить</button>';
                }
                
                html += '  </div>';
                html += '</div>';
            });
            container.innerHTML = html;
        })
        .catch(function(err) {
            container.innerHTML = '<div class="empty">Ошибка: ' + err + '</div>';
        });
    }

    // ... остальные функции (assignShelf, updateResinOrder, splitOrder, addSplitRow) ...
</script>

</body>
</html>
