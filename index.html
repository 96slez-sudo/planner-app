<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Планировщик производства</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f4f6f9; padding: 16px; min-height: 100vh; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; }
        .header { margin-bottom: 16px; }
        .header h1 { font-size: 22px; font-weight: 600; color: #1a1a2e; }
        .header p { font-size: 14px; color: #888; }
        .nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; background: white; padding: 8px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .nav a { padding: 6px 12px; background: #eef1f4; border-radius: 16px; text-decoration: none; font-size: 12px; color: #555; font-weight: 500; }
        .nav a:hover { background: #dce0e4; }
        .nav a.active { background: #2c3e50; color: white; }
        .card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eaeef2; }
        .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: #1a1a2e; }
        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 4px; }
        .field input, .field select { width: 100%; padding: 10px 12px; border: 1.5px solid #dce0e5; border-radius: 8px; font-size: 15px; background: #fafbfc; }
        .field input:focus, .field select:focus { outline: none; border-color: #2c3e50; background: white; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .row .field { margin-bottom: 0; }
        .check-group { display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 2px 0 10px 0; }
        .check-group label { display: flex; align-items: center; gap: 5px; font-size: 14px; color: #333; cursor: pointer; }
        .check-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: #2c3e50; cursor: pointer; }
        .btn { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #1a252f; }
        .btn:disabled { background: #95a5a6; cursor: not-allowed; }
        .btn-sm { padding: 6px 14px; width: auto; font-size: 13px; }
        .btn-success { background: #27ae60; }
        .btn-success:hover { background: #1e8449; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .badge { display: inline-block; padding: 3px 12px; border-radius: 16px; font-size: 12px; font-weight: 500; }
        .badge-waiting { background: #fff3cd; color: #856404; }
        .badge-work { background: #cce5ff; color: #004085; }
        .badge-done { background: #d4edda; color: #155724; }
        .badge-launched { background: #e8daef; color: #6c3483; }
        .order-item { padding: 12px 0; border-bottom: 1px solid #f0f2f5; }
        .order-item:last-child { border-bottom: none; }
        .order-item .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .order-item .order-num { font-weight: 600; font-size: 15px; color: #1a1a2e; }
        .order-item .order-stage { font-size: 14px; color: #666; }
        .order-item .order-meta { font-size: 13px; color: #999; }
        .order-item .actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
        .msg { padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .empty { text-align: center; padding: 28px 0; color: #aaa; font-size: 14px; }
        .loading { text-align: center; padding: 16px 0; color: #999; font-size: 14px; }
        @media (max-width: 480px) {
            body { padding: 12px; }
            .card { padding: 14px; }
            .row { grid-template-columns: 1fr; gap: 0; }
            .row .field { margin-bottom: 12px; }
            .row .field:last-child { margin-bottom: 0; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Планировщик производства</h1>
        <p>Управление заказами</p>
    </div>
    <div class="nav">
        <a href="/planner-app/" class="active">Главная</a>
        <a href="/planner-app/prep.html">Подготовка</a>
        <a href="/planner-app/print.html">Печать</a>
        <a href="/planner-app/cutter.html">Каттер</a>
        <a href="/planner-app/cutting.html">Раскрой</a>
        <a href="/planner-app/resin.html">Смола</a>
        <a href="/planner-app/drying.html">Сушка</a>
        <a href="/planner-app/otk.html">ОТК</a>
        <a href="/planner-app/packing.html">Упаковка</a>
    </div>
    <div id="message" class="msg"></div>
    <div class="card">
        <h3>Создать заказ</h3>
        <div class="field">
            <label>Номер заказа</label>
            <input type="text" id="orderNumber" placeholder="Например: 1001" />
        </div>
        <div class="row">
            <div class="field">
                <label>Дата создания</label>
                <input type="date" id="creationDate" />
            </div>
            <div class="field">
                <label>Плановая дата</label>
                <input type="date" id="planDate" />
            </div>
        </div>
        <div class="field">
            <label>Приоритет</label>
            <select id="priority">
                <option value="Срочный">Срочный</option>
                <option value="Высокий">Высокий</option>
                <option value="Обычный" selected>Обычный</option>
                <option value="Не срочный">Не срочный</option>
            </select>
        </div>
        <div class="check-group">
            <label><input type="checkbox" id="r1" /> Раскрой 1</label>
            <label><input type="checkbox" id="resin" /> Смола</label>
            <label><input type="checkbox" id="r2" /> Раскрой 2</label>
        </div>
        <button class="btn" onclick="createOrder()">Запустить заказ</button>
    </div>
    <div class="card">
        <h3>Все заказы</h3>
        <div id="orderList"></div>
        <button class="btn" style="font-size:14px; padding:8px; margin-top:10px; background:#eef1f4; color:#333;" onclick="loadOrders()">Обновить</button>
    </div>
</div>
<script>
    // ВСТАВЬТЕ СВОИ ДАННЫЕ ИЗ НАСТРОЕК SUPABASE (Settings -> API)
    const SUPABASE_URL = 'https://knuqfydp6kkdapivsnm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6k1bwNvlNAjNYI9NrijXtg_clTUDrOJ';

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type) {
        var el = document.getElementById('message');
        el.textContent = text;
        el.className = 'msg show ' + type;
        setTimeout(function() { el.classList.remove('show'); }, 5000);
    }

    async function createOrder() {
        var orderNumber = document.getElementById('orderNumber').value.trim();
        var creationDate = document.getElementById('creationDate').value;
        var planDate = document.getElementById('planDate').value;
        var priority = document.getElementById('priority').value;

        if (!orderNumber) { showMessage('Введите номер заказа', 'err'); return; }
        if (!creationDate) { showMessage('Выберите дату создания', 'err'); return; }
        if (!planDate) { showMessage('Выберите плановую дату', 'err'); return; }

        var btn = document.querySelector('.card .btn');
        btn.disabled = true;
        btn.textContent = 'Запуск...';

        // 1. Сохраняем заказ в таблицу orders
        const { data, error } = await supabaseClient
            .from('orders')
            .insert([
                { 
                    order_number: orderNumber, 
                    creation_date: creationDate, 
                    plan_date: planDate, 
                    priority: priority,
                    r1: document.getElementById('r1').checked,
                    resin: document.getElementById('resin').checked,
                    r2: document.getElementById('r2').checked,
                    status: 'Запущен'
                }
            ]);

        // 2. Если заказ создался успешно, записываем первый шаг в историю
        if (!error) {
            await supabaseClient
                .from('order_history')
                .insert([
                    { 
                        order_id: orderNumber, 
                        stage: 'Создание', 
                        status: 'Запущен' 
                    }
                ]);
        }

        btn.disabled = false;
        btn.textContent = 'Запустить заказ';

        if (error) {
            showMessage('Ошибка: ' + error.message, 'err');
        } else {
            showMessage('Заказ ' + orderNumber + ' создан', 'ok');
            document.getElementById('orderNumber').value = '';
            document.getElementById('creationDate').value = '';
            document.getElementById('planDate').value = '';
            document.getElementById('r1').checked = false;
            document.getElementById('resin').checked = false;
            document.getElementById('r2').checked = false;
            loadOrders();
        }
    }

    async function loadOrders() {
        var container = document.getElementById('orderList');
        container.innerHTML = '<div class="loading">Загрузка...</div>';

        // Загружаем только незавершённые заказы
        const { data, error } = await supabaseClient
            .from('orders')
            .select('*')
            .neq('status', 'Завершено');

        if (error) {
            container.innerHTML = '<div class="empty">Ошибка: ' + error.message + '</div>';
            return;
        }

        if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty">Нет активных заказов</div>';
            return;
        }

        var html = '';
        data.forEach(function(item) {
            var badgeClass = '';
            var statusText = item.status || 'Ожидание';
            if (statusText === 'Запущен') badgeClass = 'badge-launched';
            else if (statusText === 'Ожидание') badgeClass = 'badge-waiting';
            else if (statusText === 'В работе') badgeClass = 'badge-work';
            else if (statusText === 'Выполнено') badgeClass = 'badge-done';

            html += '<div class="order-item">';
            html += '  <div class="head">';
            html += '    <span class="order-num">№ ' + item.order_number + '</span>';
            html += '    <span class="badge ' + badgeClass + '">' + statusText + '</span>';
            html += '  </div>';
            html += '  <div class="order-stage">Приоритет: ' + item.priority + '</div>';
            html += '  <div class="order-meta">Дата создания: ' + item.creation_date + '</div>';
            html += '  <div class="actions">';
            html += '  </div>';
            html += '</div>';
        });
        container.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', function() { loadOrders(); });
</script>
</body>
</html>
