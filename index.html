<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Планировщик производства</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Science Gothic', 'Asta Sans-Regular', sans-serif; background: #ffffff; color: #161616; padding: 16px; min-height: 100vh; display: flex; justify-content: center; }
        a { text-decoration: none; }

        .container { max-width: 1520px; width: 100%; }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid #eeeeee;
        }
        .header .title { font-size: 20px; letter-spacing: 0.5px; font-weight: 400; }
        .header .subtitle { font-size: 16px; font-weight: 400; color: #161616; cursor: pointer; transition: 0.2s; }
        .header .subtitle:hover { opacity: 0.7; }

        .section-title { font-size: 32px; font-weight: 400; margin-bottom: 24px; }
        .stage-block { margin-bottom: 40px; }
        .stages {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .stage-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            background: #cdcdcd;
            border-radius: 8px;
            color: #141414;
            font-size: 18px;
            transition: 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
        }
        .stage-btn:hover { background: #b0b0b0; }
        .stage-btn.active {
            background: #1e1e1e;
            color: #ffffff;
        }
        .stage-btn.active:hover { background: #1e1e1e; }

        .orders-block { margin-top: 16px; }
        .orders-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .order-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 16px 20px;
            padding: 16px;
            border: 1px solid #eeeeee;
            border-radius: 12px;
        }
        .order-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 120px;
            min-width: 100px;
        }
        .order-col .label { font-size: 18px; font-weight: 400; }
        .order-col .value {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border: 1px solid #6c6c6c;
            border-radius: 8px;
            font-family: 'Asta Sans-Regular', sans-serif;
            font-size: 15px;
            min-height: 40px;
        }

        .status-work { background-color: #ffe26f; border-color: #ffe26f; }
        .status-wait { background-color: #cdcdcd; border-color: #cdcdcd; }

        .msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @media (max-width: 768px) {
            .header .title { font-size: 16px; }
            .header .subtitle { font-size: 14px; }
            .section-title { font-size: 26px; }
            .stage-btn { font-size: 15px; padding: 8px 14px; }
            .order-col { min-width: 80px; flex: 1 1 80px; }
            .order-col .label { font-size: 15px; }
            .order-col .value { font-size: 13px; padding: 6px 10px; min-height: 34px; }
            .order-row { padding: 12px; }
        }
        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .section-title { font-size: 24px; }
            .stage-btn { font-size: 14px; padding: 6px 12px; }
            .order-row { gap: 8px 12px; }
            .order-col { flex: 1 1 45%; min-width: 40%; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">//ПЛАНИРОВЩИК ПРОИЗВОДСТВА</div>
        <a href="/" class="subtitle">ГЛАВНАЯ//</a>
    </div>
    <div id="message" class="msg"></div>
    <div class="stage-block">
        <div class="section-title">Выберите свой этап</div>
        <div class="stages">
            <a href="/create.html" class="stage-btn">Создание заказа</a>
            <a href="/prep.html" class="stage-btn">Подготовка</a>
            <a href="/print.html" class="stage-btn">Печать</a>
            <a href="/cutter.html" class="stage-btn">Каттер</a>
            <a href="/cutting.html" class="stage-btn">Раскрой</a>
            <a href="/resin.html" class="stage-btn">Смола</a>
            <a href="/drying.html" class="stage-btn">Сушка</a>
            <a href="/otk.html" class="stage-btn">ОТК</a>
            <a href="/packing.html" class="stage-btn">Упаковка</a>
        </div>
    </div>
    <div class="orders-block">
        <div class="section-title">Активные заказы</div>
        <div id="ordersGrid" class="orders-grid">
            <div style="text-align: center; padding: 40px 0; color: #999;">Загрузка заказов...</div>
        </div>
    </div>
</div>
<script>
    const SUPABASE_URL = 'https://knuqfyjdptkkdapivsnm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6k1bwNvlNAjNYI9NrijXtg_clTUDrOJ';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type) {
        var el = document.getElementById('message');
        el.textContent = text;
        el.className = 'msg show ' + type;
        setTimeout(function() { el.classList.remove('show'); }, 5000);
    }
    function formatDate(dateStr) {
        if (!dateStr) return '—';
        try {
            var d = new Date(dateStr);
            return d.toLocaleDateString('ru-RU');
        } catch (e) { return dateStr; }
    }
    async function loadOrders() {
        var grid = document.getElementById('ordersGrid');
        grid.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Загрузка...</div>';
        const { data, error } = await supabaseClient
            .from('orders')
            .select('*')
            .neq('status', 'Завершено')
            .order('creation_date', { ascending: false });
        if (error) {
            grid.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #c0392b;">Ошибка загрузки</div>';
            console.error(error);
            return;
        }
        if (!data || data.length === 0) {
            grid.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Нет активных заказов</div>';
            return;
        }
        var html = '';
        data.forEach(function(item) {
            var statusClass = 'status-wait';
            var statusText = item.status || 'Ожидание';
            if (statusText === 'Запущен' || statusText === 'В работе') { statusClass = 'status-work'; }
            html += 
                '<div class="order-row">' +
                    '<div class="order-col">' +
                        '<div class="label">№ заказа</div>' +
                        '<div class="value">' + item.order_number + '</div>' +
                    '</div>' +
                    '<div class="order-col">' +
                        '<div class="label">Этап</div>' +
                        '<div class="value">' + (item.stage || '—') + '</div>' +
                    '</div>' +
                    '<div class="order-col">' +
                        '<div class="label">Статус</div>' +
                        '<div class="value ' + statusClass + '">' + statusText + '</div>' +
                    '</div>' +
                '</div>';
        });
        grid.innerHTML = html;
    }
    document.addEventListener('DOMContentLoaded', function() { loadOrders(); });
</script>
</body>
</html>
