<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Планировщик производства</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Science Gothic', sans-serif; 
            background: #ffffff; 
            color: #161616; 
            padding: 16px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
        }
        a { text-decoration: none; }

        .container { max-width: 1520px; width: 100%; }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid #eeeeee;
        }
        .header .title { font-size: 20px; letter-spacing: 0.5px; color: #161616; }
        .header .subtitle { font-size: 16px; color: #161616; cursor: pointer; transition: 0.2s; }
        .header .subtitle:hover { opacity: 0.7; }

        .section-title { font-size: 32px; margin-bottom: 24px; color: #161616; }
        .stage-block { margin-bottom: 40px; }
        .stages {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .stage-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            background: #cdcdcd;
            border-radius: 8px;
            color: #141414;
            font-size: 18px;
            transition: 0.2s;
        }
        .stage-btn:hover { background: #b0b0b0; }
        .stage-btn.active {
            background: #1e1e1e;
            color: #ffffff;
        }

        .orders-block { margin-top: 16px; }
        .orders-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .order-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px 24px;
        }
        .order-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1 1 180px;
            min-width: 140px;
        }
        .order-col .label { font-size: 18px; color: #161616; }
        .order-col .value {
            display: flex;
            align-items: center;
            padding: 0 12px;
            border: 1px solid #6c6c6c;
            border-radius: 8px;
            font-family: 'Science Gothic', sans-serif;
            font-size: 15px;
            background: #fff;
            height: 40px;
        }

        .status-wait { background-color: #e0e0e0 !important; border-color: #b0b0b0 !important; color: #555 !important; }
        .status-work { background-color: #ffe066 !important; border-color: #d4b300 !important; color: #1a1a1a !important; }

        /* Стили для типа заказа */
        .type-r2 { background-color: #e8f5e9 !important; border-color: #66bb6a !important; color: #2e7d32 !important; }
        .type-r1 { background-color: #e3f2fd !important; border-color: #42a5f5 !important; color: #0d47a1 !important; }
        .type-resin { background-color: #fff3e0 !important; border-color: #ffa726 !important; color: #e65100 !important; }
        .type-full { background-color: #f3e5f5 !important; border-color: #ab47bc !important; color: #4a148c !important; }

        .msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @media (max-width: 992px) {
            .order-row { align-items: flex-start; }
            .order-col { flex: 1 1 100%; max-width: 100%; }
        }
        @media (max-width: 600px) {
            .header .title { font-size: 16px; }
            .header .subtitle { font-size: 14px; }
            .section-title { font-size: 26px; }
            .stage-btn { font-size: 14px; padding: 6px 12px; }
        }
        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .order-col .label { font-size: 16px; }
            .order-col .value { font-size: 13px; height: 36px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">//ПЛАНИРОВЩИК ПРОИЗВОДСТВА</div>
        <a href="/planner-app/" class="subtitle">ГЛАВНАЯ//</a>
    </div>
    <div id="message" class="msg"></div>

    <div class="stage-block">
        <div class="section-title">Выберите свой этап</div>
        <div class="stages">
            <a href="/planner-app/create.html" class="stage-btn">Создание заказа</a>
            <a href="/planner-app/prep.html" class="stage-btn">Подготовка</a>
            <a href="/planner-app/print.html" class="stage-btn">Печать</a>
            <a href="/planner-app/cutter.html" class="stage-btn">Каттер</a>
            <a href="/planner-app/cutting.html" class="stage-btn">Раскрой</a>
            <a href="/planner-app/resin.html" class="stage-btn">Смола</a>
            <a href="/planner-app/drying.html" class="stage-btn">Сушка</a>
            <a href="/planner-app/otk.html" class="stage-btn">ОТК</a>
            <a href="/planner-app/packing.html" class="stage-btn">Упаковка</a>
        </div>
    </div>

    <div class="orders-block">
        <div class="section-title">Активные заказы</div>
        <div id="ordersGrid" class="orders-grid">
            <div style="text-align: center; padding: 40px 0; color: #999;">Загрузка заказов...</div>
        </div>
    </div>
</div>
<script>
    const SUPABASE_URL = 'https://knuqfyjdptkkdapivsnm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6k1bwNvlNAjNYI9NrijXtg_clTUDrOJ';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type) {
        var el = document.getElementById('message');
        el.textContent = text;
        el.className = 'msg show ' + type;
        setTimeout(function() { el.classList.remove('show'); }, 5000);
    }

    function formatDate(dateStr) {
        if (!dateStr) return '—';
        try {
            var d = new Date(dateStr);
            return d.toLocaleDateString('ru-RU');
        } catch (e) { return dateStr; }
    }

    // Функция для получения класса CSS в зависимости от типа
    function getTypeClass(type) {
        if (!type) return '';
        if (type === 'Р2') return 'type-r2';
        if (type === 'Р1' || type === 'Р1+Р2') return 'type-r1';
        if (type === 'Смола' || type === 'Смола+Р2') return 'type-resin';
        if (type === 'Р1+Смола' || type === 'Р1+Смола+Р2') return 'type-full';
        return '';
    }

    async function loadOrders() {
        const grid = document.getElementById('ordersGrid');
        grid.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Загрузка...</div>';

        const { data, error } = await supabaseClient
            .from('orders')
            .select('*')
            .neq('status', 'Завершено')
            .order('creation_date', { ascending: false });

        if (error) {
            grid.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #c0392b;">Ошибка загрузки</div>';
            return;
        }
        if (!data || data.length === 0) {
            grid.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Нет активных заказов</div>';
            return;
        }

        let html = '';
        data.forEach(item => {
            let statusClass = 'status-wait';
            let statusText = 'Ожидает';
            if (item.status === 'В работе') { 
                statusClass = 'status-work'; 
                statusText = 'В работе'; 
            } else if (item.status === 'Ожидает') { 
                statusClass = 'status-wait'; 
                statusText = 'Ожидает'; 
            }

            // Определяем тип для отображения
            const typeDisplay = item.path || '—';
            const typeClass = getTypeClass(item.path);

            html += `
                <div class="order-row">
                    <div class="order-col"><div class="label">№ заказа</div><div class="value">${item.order_number}</div></div>
                    <div class="order-col"><div class="label">Тип</div><div class="value ${typeClass}" style="font-size: 13px;">${typeDisplay}</div></div>
                    <div class="order-col"><div class="label">Этап</div><div class="value">${item.stage || '—'}</div></div>
                    <div class="order-col"><div class="label">Статус</div><div class="value ${statusClass}">${statusText}</div></div>
                    <div class="order-col"><div class="label">Дата запуска</div><div class="value">${formatDate(item.creation_date)}</div></div>
                    <div class="order-col"><div class="label">Плановая дата</div><div class="value">${formatDate(item.plan_date)}</div></div>
                </div>
            `;
        });
        grid.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', loadOrders);
</script>
</body>
</html>
