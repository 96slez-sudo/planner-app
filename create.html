<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Создание заказа</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Science Gothic', sans-serif; 
            background: #ffffff; 
            color: #161616; 
            padding: 16px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
        }
        a { text-decoration: none; }

        .container { max-width: 1520px; width: 100%; }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid #eeeeee;
        }
        .header .title { font-size: 20px; letter-spacing: 0.5px; color: #161616; }
        .header .subtitle { font-size: 16px; color: #161616; cursor: pointer; transition: 0.2s; }
        .header .subtitle:hover { opacity: 0.7; }

        .stages {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 40px;
        }
        .stage-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            background: #cdcdcd;
            border-radius: 8px;
            color: #141414;
            font-size: 18px;
            transition: 0.2s;
        }
        .stage-btn:hover { background: #b0b0b0; }
        .stage-btn.active { background: #1e1e1e; color: #ffffff; }

        .create-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 60px;
            margin-top: 16px;
        }
        .create-layout .left { flex: 1; min-width: 320px; }
        .create-layout .right { flex: 1.5; min-width: 350px; }

        .form-title { font-size: 32px; margin-bottom: 24px; color: #161616; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 20px;
            margin-bottom: 24px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label { font-size: 18px; color: #161616; }
        .form-group input, .form-group select {
            padding: 0 12px;
            height: 40px;
            border: 1px solid #6c6c6c;
            border-radius: 8px;
            font-family: 'Science Gothic', sans-serif;
            font-size: 15px;
            width: 100%;
