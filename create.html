<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Создание заказа</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Science Gothic', 'Asta Sans-Regular', sans-serif; background: #ffffff; color: #161616; padding: 16px; min-height: 100vh; display: flex; justify-content: center; }
        a { text-decoration: none; }

        .container { max-width: 1520px; width: 100%; }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid #eeeeee;
        }
        .header .title { font-size: 20px; letter-spacing: 0.5px; font-weight: 400; }
        .header .subtitle { font-size: 16px; font-weight: 400; color: #161616; cursor: pointer; transition: 0.2s; }
        .header .subtitle:hover { opacity: 0.7; }

        .section-title { font-size: 32px; font-weight: 400; margin-bottom: 24px; }
        .stage-block { margin-bottom: 40px; }
        .stages {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .stage-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            background: #cdcdcd;
            border-radius: 8px;
            color: #141414;
            font-size: 18px;
            transition: 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
        }
        .stage-btn:hover { background: #b0b0b0; }
        .stage-btn.active {
            background: #1e1e1e;
            color: #ffffff;
        }
        .stage-btn.active:hover { background: #1e1e1e; }

        .create-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 60px;
            margin-top: 16px;
        }
        .create-layout .left { flex: 1; min-width: 320px; }
        .create-layout .right { flex: 1.5; min-width: 350px; }

        .form-title { font-size: 32px; font-weight: 400; margin-bottom: 24px; }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 20px;
            margin-bottom: 24px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 20px;
            font-weight: 400;
        }
        .form-group input,
        .form-group select {
            padding: 10px 12px;
            border: 1px solid #6c6c6c;
            border-radius: 8px;
            font-family: 'Asta Sans-Regular', sans-serif;
            font-size: 16px;
            width: 100%;
            background: #fff;
            color: #161616;
        }
        .form-group input::placeholder { color: #999; }
        .form-group select { appearance: none; }

        .check-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0 30px 0;
        }
        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            cursor: pointer;
        }
        .check-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2c3e50;
            cursor: pointer;
        }

        .btn-green {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 24px;
            background-color: #0f8653;
            border-radius: 8px;
            color: #ffffff;
            font-size: 20px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-green:hover { opacity: 0.8; }
        .btn-green:disabled { opacity: 0.5; cursor: not-allowed; }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .order-card {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
        }
        .order-card .col {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 100px;
        }
        .order-card .col .label {
            font-size: 18px;
            font-weight: 400;
        }
        .order-card .col .value {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border: 1px solid #6c6c6c;
            border-radius: 8px;
            font-family: 'Asta Sans-Regular', sans-serif;
            font-size: 15px;
            min-height: 40px;
        }
        .status-work { background-color: #ffe26f; border-color: #ffe26f; }
        .status-wait { background-color: #cdcdcd; border-color: #cdcdcd; }

        .msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @media (max-width: 768px) {
            .header .title { font-size: 16px; }
            .header .subtitle { font-size: 14px; }
            .section-title, .form-title { font-size: 26px; }
            .stage-btn { font-size: 15px; padding: 8px 14px; }
            .create-layout { flex-direction: column; gap: 40px; }
            .form-grid { grid-template-columns: 1fr; }
            .order-card .col { min-width: 80px; }
            .order-card .col .label { font-size: 15px; }
            .order-card .col .value { font-size: 13px; padding: 6px 10px; min-height: 34px; }
            .btn-green { font-size: 16px; padding: 8px 16px; }
        }
        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .section-title, .form-title { font-size: 24px; }
            .stage-btn { font-size: 14px; padding: 6px 12px; }
            .check-group { gap: 12px; }
            .check-item { font-size: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">//ПЛАНИРОВЩИК ПРОИЗВОДСТВА</div>
        <a href="/planner-app/" class="subtitle">ГЛАВНАЯ//</a>
    </div>
    <div id="message" class="msg"></div>
    <div class="stage-block">
        <div class="section-title">Выберите свой этап</div>
        <div class="stages">
            <a href="/planner-app/create.html" class="stage-btn active">Создание заказа</a>
            <a href="/planner-app/prep.html" class="stage-btn">Подготовка</a>
            <a href="/planner-app/print.html" class="stage-btn">Печать</a>
            <a href="/planner-app/cutter.html" class="stage-btn">Каттер</a>
            <a href="/planner-app/cutting.html" class="stage-btn">Раскрой</a>
            <a href="/planner-app/resin.html" class="stage-btn">Смола</a>
            <a href="/planner-app/drying.html" class="stage-btn">Сушка</a>
            <a href="/planner-app/otk.html" class="stage-btn">ОТК</a>
            <a href="/planner-app/packing.html" class="stage-btn">Упаковка</a>
        </div>
    </div>
    <div class="create-layout">
        <div class="left">
            <div class="form-title">Создать и запустить заказ</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>№ заказа</label>
                    <input type="text" id="orderNumber" placeholder="Например: 1001" />
                </div>
                <div class="form-group">
                    <label>Дата создания</label>
                    <input type="date" id="creationDate" />
                </div>
                <div class="form-group">
                    <label>Плановая дата</label>
                    <input type="date" id="planDate" />
                </div>
                <div class="form-group">
                    <label>Приоритет</label>
                    <select id="priority">
                        <option value="Обычный">Обычный</option>
                        <option value="Срочный">Срочный</option>
                        <option value="Высокий">Высокий</option>
                        <option value="Не срочный">Не срочный</option>
                    </select>
                </div>
            </div>
            <div class="check-group">
                <label class="check-item">
                    <input type="checkbox" id="r1" /> Раскрой 1
                </label>
                <label class="check-item">
                    <input type="checkbox" id="resin" /> Смола
                </label>
                <label class="check-item">
                    <input type="checkbox" id="r2" /> Раскрой 2
                </label>
            </div>
            <button class="btn-green" onclick="createOrder()">Создать заказ</button>
        </div>
        <div class="right">
            <div class="form-title">Запущенные заказы</div>
            <div id="orderList" class="order-list">
                <div style="text-align: center; padding: 40px 0; color: #999;">Загрузка заказов...</div>
            </div>
        </div>
    </div>
</div>
<script>
    const SUPABASE_URL = 'https://knuqfyjdptkkdapivsnm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6k1bwNvlNAjNYI9NrijXtg_clTUDrOJ';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type) {
        var el = document.getElementById('message');
        el.textContent = text;
        el.className = 'msg show ' + type;
        setTimeout(function() { el.classList.remove('show'); }, 5000);
    }
    function formatDate(dateStr) {
        if (!dateStr) return '—';
        try {
            var d = new Date(dateStr);
            return d.toLocaleDateString('ru-RU');
        } catch (e) { return dateStr; }
    }
    async function createOrder() {
        var orderNumber = document.getElementById('orderNumber').value.trim();
        var creationDate = document.getElementById('creationDate').value;
        var planDate = document.getElementById('planDate').value;
        var priority = document.getElementById('priority').value;
        if (!orderNumber) { showMessage('Введите номер заказа', 'err'); return; }
        if (!creationDate) { showMessage('Выберите дату создания', 'err'); return; }
        if (!planDate) { showMessage('Выберите плановую дату', 'err'); return; }

        var btn = document.querySelector('.btn-green');
        btn.disabled = true;
        btn.textContent = 'Создание...';

        var r1 = document.getElementById('r1').checked;
        var resin = document.getElementById('resin').checked;
        var r2 = document.getElementById('r2').checked;
        var path = '';
        if (r1 && resin && r2) path = 'Р1+Смола+Р2';
        else if (r1 && resin) path = 'Р1+Смола';
        else if (r1 && r2) path = 'Р1+Р2';
        else if (r2 && resin) path = 'Смола+Р2';
        else if (r1) path = 'Р1';
        else if (resin) path = 'Смола';
        else if (r2) path = 'Р2';
        else path = '';

        const { data, error } = await supabaseClient
            .from('orders')
            .insert([
                { 
                    order_number: orderNumber, 
                    creation_date: creationDate, 
                    plan_date: planDate, 
                    priority: priority,
                    r1: r1, resin: resin, r2: r2,
                    path: path,
                    status: 'Запущен', stage: 'Подготовка'
                }
            ]);
        if (!error) {
            await supabaseClient
                .from('stages')
                .insert([
                    { order_number: orderNumber, stage: 'Подготовка', status: 'Ожидание' }
                ]);
        }
        btn.disabled = false;
        btn.textContent = 'Создать заказ';
        if (error) {
            showMessage('Ошибка: ' + error.message, 'err');
        } else {
            showMessage('Заказ ' + orderNumber + ' создан', 'ok');
            document.getElementById('orderNumber').value = '';
            document.getElementById('creationDate').value = '';
            document.getElementById('planDate').value = '';
            document.getElementById('r1').checked = false;
            document.getElementById('resin').checked = false;
            document.getElementById('r2').checked = false;
            loadOrders();
        }
    }
    async function loadOrders() {
        var container = document.getElementById('orderList');
        container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Загрузка...</div>';
        const { data, error } = await supabaseClient
            .from('orders')
            .select('*')
            .neq('status', 'Завершено')
            .order('creation_date', { ascending: false });
        if (error) {
            container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #c0392b;">Ошибка загрузки</div>';
            return;
        }
        if (!data || data.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Нет активных заказов</div>';
            return;
        }
        var html = '';
        data.forEach(function(item) {
            var statusClass = 'status-wait';
            var statusText = item.status || 'Ожидание';
            if (statusText === 'Запущен' || statusText === 'В работе') { statusClass = 'status-work'; }
            html += 
                '<div class="order-card">' +
                    '<div class="col">' +
                        '<div class="label">№ заказа</div>' +
                        '<div class="value">' + item.order_number + '</div>' +
                    '</div>' +
                    '<div class="col">' +
                        '<div class="label">Этап</div>' +
                        '<div class="value">' + (item.stage || '—') + '</div>' +
                    '</div>' +
                    '<div class="col">' +
                        '<div class="label">Статус</div>' +
                        '<div class="value ' + statusClass + '">' + statusText + '</div>' +
                    '</div>' +
                '</div>';
        });
        container.innerHTML = html;
    }
    document.addEventListener('DOMContentLoaded', function() { loadOrders(); });
</script>
</body>
</html>
