<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Сушка — Планировщик</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f4f6f9; padding: 16px; min-height: 100vh; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; }
        .header { margin-bottom: 16px; }
        .header h1 { font-size: 22px; font-weight: 600; color: #1a1a2e; }
        .header p { font-size: 14px; color: #888; }
        .nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; background: white; padding: 8px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .nav a { padding: 6px 12px; background: #eef1f4; border-radius: 16px; text-decoration: none; font-size: 12px; color: #555; font-weight: 500; }
        .nav a:hover { background: #dce0e4; }
        .nav a.active { background: #2c3e50; color: white; }
        .card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eaeef2; }
        .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: #1a1a2e; }
        .field { margin-bottom: 10px; }
        .field label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 4px; }
        .field select { width: 100%; padding: 10px 12px; border: 1.5px solid #dce0e5; border-radius: 8px; font-size: 15px; background: #fafbfc; }
        .btn { padding: 8px 16px; background: #2c3e50; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #1a252f; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn-success { background: #27ae60; }
        .btn-success:hover { background: #1e8449; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-warning:hover { background: #d68910; }
        .badge { display: inline-block; padding: 3px 12px; border-radius: 16px; font-size: 12px; font-weight: 500; }
        .badge-waiting { background: #fff3cd; color: #856404; }
        .badge-work { background: #cce5ff; color: #004085; }
        .badge-done { background: #d4edda; color: #155724; }
        .badge-drying { background: #fdebd0; color: #935e38; }
        .item { padding: 12px 0; border-bottom: 1px solid #f0f2f5; }
        .item:last-child { border-bottom: none; }
        .item .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .item .order-num { font-weight: 600; font-size: 15px; color: #1a1a2e; }
        .item .order-meta { font-size: 14px; color: #666; }
        .item .actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .shelf-select { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .shelf-select select { padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
        .msg { padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .empty { text-align: center; padding: 28px 0; color: #aaa; font-size: 14px; }
        .loading { text-align: center; padding: 16px 0; color: #999; font-size: 14px; }
        @media (max-width: 480px) {
            body { padding: 12px; }
            .card { padding: 14px; }
            .nav a { font-size: 11px; padding: 5px 10px; }
            .shelf-select { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Сушка</h1>
        <p>Стеллажи и сушка</p>
    </div>

    <div class="nav">
        <a href="/planner-app/">Главная</a>
        <a href="/planner-app/prep.html">Подготовка</a>
        <a href="/planner-app/print.html">Печать</a>
        <a href="/planner-app/cutter.html">Каттер</a>
        <a href="/planner-app/cutting.html">Раскрой</a>
        <a href="/planner-app/resin.html">Смола</a>
        <a href="/planner-app/drying.html" class="active">Сушка</a>
        <a href="/planner-app/otk.html">ОТК</a>
        <a href="/planner-app/packing.html">Упаковка</a>
    </div>

    <div id="message" class="msg"></div>

    <div class="card">
        <h3>Стеллажи</h3>
        <div id="dryingList"></div>
        <button class="btn" style="width:100%; margin-top:10px; background:#eef1f4; color:#333;" onclick="loadDryingOrders()">Обновить</button>
    </div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxa8Ag_VFouB9IITEXP0XlcMtVMsG-MgeheLC3f38x_TDnLqpQGy7OmvyPxTPAcueFbcw/exec';

    function showMessage(text, type) {
        var el = document.getElementById('message');
        el.textContent = text;
        el.className = 'msg show ' + type;
        setTimeout(function() { el.classList.remove('show'); }, 5000);
    }

    function loadDryingOrders() {
        var container = document.getElementById('dryingList');
        container.innerHTML = '<div class="loading">Загрузка...</div>';

        fetch(API_URL + '?action=getDryingOrders&_=' + Date.now())
        .then(function(response) { return response.json(); })
        .then(function(result) {
            if (result.error) {
                container.innerHTML = '<div class="empty">Ошибка: ' + result.error + '</div>';
                return;
            }
            if (!result.data || result.data.length === 0) {
                container.innerHTML = '<div class="empty">Нет стеллажей</div>';
                return;
            }
            var html = '';
            result.data.forEach(function(item) {
                var badgeClass = '';
                var statusText = 'Свободен';
                
                if (item.packed && !item.rolledOut) {
                    statusText = 'На сушке';
                    badgeClass = 'badge-drying';
                } else if (item.packed && item.rolledOut) {
                    statusText = 'Готов к выкату';
                    badgeClass = 'badge-done';
                } else if (!item.packed && item.count > 0) {
                    statusText = 'Укомплектован';
                    badgeClass = 'badge-work';
                } else {
                    badgeClass = 'badge-waiting';
                }

                html += '<div class="item">';
                html += '  <div class="head">';
                html += '    <span class="order-num">Стеллаж ' + item.shelf + '</span>';
                html += '    <span class="badge ' + badgeClass + '">' + statusText + '</span>';
                html += '  </div>';
                html += '  <div class="order-meta">Заказов: ' + item.count + ' | Зона: ' + (item.zone || '—') + '</div>';
                if (item.orders) {
                    html += '  <div class="order-meta">Заказы: ' + item.orders + '</div>';
                }
                html += '  <div class="actions">';
                
                if (item.count > 0 && !item.packed && !item.rolledOut) {
                    html += '    <div class="shelf-select">';
                    html += '      <select id="zone-' + item.shelf + '">';
                    for (var z = 1; z <= 5; z++) {
                        html += '<option value="Зона ' + z + '">Зона ' + z + '</option>';
                    }
                    html += '      </select>';
                    html += '      <button class="btn btn-sm btn-success" onclick="packShelf(\'' + item.shelf + '\')">Укомплектовать</button>';
                    html += '    </div>';
                }
                
                if (item.packed && !item.rolledOut) {
                    html += '    <button class="btn btn-sm btn-danger" onclick="rollOutShelf(\'' + item.shelf + '\')">Выкатить</button>';
                }
                
                html += '  </div>';
                html += '</div>';
            });
            container.innerHTML = html;
        })
        .catch(function(err) {
            container.innerHTML = '<div class="empty">Ошибка: ' + err + '</div>';
        });
    }

    function packShelf(shelf) {
        var zone = document.getElementById('zone-' + shelf).value;
        var data = { action: 'packShelf', shelf: shelf, zone: zone };

        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(function() {
            showMessage('Стеллаж ' + shelf + ' укомплектован, зона ' + zone, 'ok');
            loadDryingOrders();
        })
        .catch(function(err) {
            showMessage('Ошибка: ' + err, 'err');
        });
    }

    function rollOutShelf(shelf) {
        var data = { action: 'rollOutShelf', shelf: shelf };

        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(function() {
            showMessage('Стеллаж ' + shelf + ' выкатили', 'ok');
            loadDryingOrders();
        })
        .catch(function(err) {
            showMessage('Ошибка: ' + err, 'err');
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadDryingOrders();
    });
</script>

</body>
</html>
