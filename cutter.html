<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Каттер</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Science Gothic', sans-serif; 
            background: #ffffff; 
            color: #161616; 
            padding: 16px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
        }
        a { text-decoration: none; }

        .container { max-width: 1520px; width: 100%; }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid #eeeeee;
        }
        .header .title { font-size: 20px; letter-spacing: 0.5px; color: #161616; }
        .header .subtitle { font-size: 16px; color: #161616; cursor: pointer; transition: 0.2s; }
        .header .subtitle:hover { opacity: 0.7; }

        .stages {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 40px;
        }
        .stage-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            background: #cdcdcd;
            border-radius: 8px;
            color: #141414;
            font-size: 18px;
            transition: 0.2s;
        }
        .stage-btn:hover { background: #b0b0b0; }
        .stage-btn.active { background: #1e1e1e; color: #ffffff; }

        .page-title { font-size: 32px; margin-bottom: 24px; color: #161616; }
        
        .grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1050px;
            width: 100%;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            align-items: center; 
            gap: 16px 24px;
        }

        .col {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .col .label { font-size: 18px; color: #161616; }
        .col .value {
            display: flex;
            align-items: center;
            padding: 0 12px;
            border: 1px solid #6c6c6c;
            border-radius: 8px;
            font-family: 'Science Gothic', sans-serif;
            font-size: 15px;
            background: #fff;
            height: 40px;
        }

        .col-order { width: 180px; }
        .col-roll { width: 180px; }
        .col-blocks { width: 180px; }
        .col-status { width: 200px; }
        .col-actions { width: 160px; }

        .status-wait { background: #e0e0e0 !important; border-color: #b0b0b0 !important; color: #555 !important; }
        .status-work { background: #ffe066 !important; border-color: #d4b300 !important; color: #1a1a1a !important; }

        .btn-green {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            height: 40px;
            width: 160px;
            background-color: #0f8653;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            box-sizing: border-box;
        }
        .btn-green:hover { opacity: 0.8; }
        .btn-red {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            height: 40px;
            width: 160px;
            background-color: #e74c3c;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            box-sizing: border-box;
        }
        .btn-red:hover { opacity: 0.8; }

        .btn-refresh {
            width: 100%;
            padding: 12px;
            background: #eef1f4;
            border-radius: 8px;
            color: #333;
            font-size: 14px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-refresh:hover { background: #dce0e4; }

        .msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @media (max-width: 992px) {
            .row { align-items: flex-start; }
            .col-order, .col-roll, .col-blocks, .col-status, .col-actions { width: 100%; max-width: 100%; }
            .btn-green, .btn-red { width: 100%; }
        }
        @media (max-width: 600px) {
            .header .title { font-size: 16px; }
            .header .subtitle { font-size: 14px; }
            .stage-btn { font-size: 14px; padding: 6px 12px; }
            .page-title { font-size: 26px; }
            .btn-green, .btn-red { width: 100%; height: 36px; }
            .col .value { height: 36px; }
        }
        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .col .label { font-size: 16px; }
            .col .value { font-size: 13px; height: 32px; }
            .btn-green, .btn-red { height: 32px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">//ПЛАНИРОВЩИК ПРОИЗВОДСТВА</div>
        <a href="/planner-app/" class="subtitle">ГЛАВНАЯ//</a>
    </div>
    <div id="message" class="msg"></div>

    <div class="stages">
        <a href="/planner-app/create.html" class="stage-btn">Создание заказа</a>
        <a href="/planner-app/prep.html" class="stage-btn">Подготовка</a>
        <a href="/planner-app/print.html" class="stage-btn">Печать</a>
        <a href="/planner-app/cutter.html" class="stage-btn active">Каттер</a>
        <a href="/planner-app/cutting.html" class="stage-btn">Раскрой</a>
        <a href="/planner-app/resin.html" class="stage-btn">Смола</a>
        <a href="/planner-app/drying.html" class="stage-btn">Сушка</a>
        <a href="/planner-app/otk.html" class="stage-btn">ОТК</a>
        <a href="/planner-app/packing.html" class="stage-btn">Упаковка</a>
    </div>

    <div class="page-title">Очередь рулонов</div>
    <div class="grid" id="list">
        <div style="text-align: center; padding: 40px 0; color: #999;">Загрузка рулонов...</div>
    </div>
    <button class="btn-refresh" onclick="loadRolls()">Обновить</button>
</div>

<script>
    const SUPABASE_URL = 'https://knuqfyjdptkkdapivsnm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6k1bwNvlNAjNYI9NrijXtg_clTUDrOJ';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type) {
        var el = document.getElementById('message');
        el.textContent = text;
        el.className = 'msg show ' + type;
        setTimeout(function() { el.classList.remove('show'); }, 5000);
    }

    async function loadRolls() {
        const container = document.getElementById('list');
        container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Загрузка...</div>';

        const { data, error } = await supabaseClient
            .from('stages')
            .select('*')
            .eq('stage', 'Каттер')
            .in('status', ['Ожидание', 'В работе']);

        if (error) {
            container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #c0392b;">Ошибка загрузки</div>';
            return;
        }
        if (!data || data.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Нет рулонов на каттере</div>';
            return;
        }

        const sorted = [...data].sort((a, b) => {
            if (a.status === 'Ожидание' && b.status !== 'Ожидание') return -1;
            if (a.status !== 'Ожидание' && b.status === 'Ожидание') return 1;
            return 0;
        });

        let html = '';
        sorted.forEach(item => {
            const rollId = item.shelf || '—';
            
            let statusClass = 'status-wait';
            let statusText = 'Ожидает';
            if (item.status === 'В работе') {
                statusClass = 'status-work';
                statusText = 'В работе';
            }

            html += `
                <div class="row">
                    <div class="col col-order">
                        <div class="label">№ заказа</div>
                        <div class="value">${item.order_number}</div>
                    </div>
                    <div class="col col-roll">
                        <div class="label">ID рулона</div>
                        <div class="value">${rollId}</div>
                    </div>
                    <div class="col col-blocks">
                        <div class="label">Кол-во блоков</div>
                        <div class="value">${item.blocks}</div>
                    </div>
                    <div class="col col-status">
                        <div class="label">Статус</div>
                        <div class="value ${statusClass}">${statusText}</div>
                    </div>
                    <div class="col col-actions">
                        <div class="label">&nbsp;</div>
                        ${item.status === 'Ожидание' 
                            ? `<button class="btn-green" onclick="updateRoll('${item.id}', 'В работе')">Взять в работу</button>` 
                            : `<button class="btn-red" onclick="updateRoll('${item.id}', 'Выполнено')">Завершить</button>`
                        }
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    async function updateRoll(stageId, newStatus) {
        const { data: itemData, error: getError } = await supabaseClient
            .from('stages')
            .select('order_number, shelf, blocks')
            .eq('id', stageId)
            .single();

        if (getError || !itemData) {
            showMessage('Ошибка получения данных', 'err');
            return;
        }

        const { error } = await supabaseClient
            .from('stages')
            .update({ status: newStatus })
            .eq('id', stageId);

        if (error) {
            showMessage('Ошибка обновления статуса', 'err');
            return;
        }

        if (newStatus === 'Выполнено') {
            const { count, error: countError } = await supabaseClient
                .from('stages')
                .select('*', { count: 'exact', head: true })
                .eq('order_number', itemData.order_number)
                .eq('stage', 'Каттер')
                .neq('status', 'Выполнено');

            if (countError) {
                showMessage('Ошибка подсчёта рулонов', 'err');
                return;
            }

            if (count === 0) {
                const { data: orderData, error: orderError } = await supabaseClient
                    .from('orders')
                    .select('r1, r2, resin')
                    .eq('order_number', itemData.order_number)
                    .single();

                if (orderError || !orderData) {
                    showMessage('Ошибка получения данных заказа', 'err');
                    return;
                }

                // ОПРЕДЕЛЯЕМ СЛЕДУЮЩИЙ ЭТАП
                let nextStage = 'ОТК';
                let nextStageName = 'ОТК';

                if (orderData.r1 === true) {
                    nextStage = 'Раскрой';
                    nextStageName = 'Раскрой';
                } else if (orderData.resin === true) {
                    nextStage = 'Смола';
                    nextStageName = 'Смола';
                } else if (orderData.r2 === true) {
                    nextStage = 'Раскрой';
                    nextStageName = 'Раскрой';
                }

                // 1. Обновляем orders (чтобы раскрой знал, что это заказ с путем)
                await supabaseClient
                    .from('orders')
                    .update({ stage: nextStage })
                    .eq('order_number', itemData.order_number);

                // 2. Запускаем все рулоны на следующий этап
                const { data: completedRolls } = await supabaseClient
                    .from('stages')
                    .select('shelf, blocks')
                    .eq('order_number', itemData.order_number)
                    .eq('stage', 'Каттер')
                    .eq('status', 'Выполнено');

                if (completedRolls && completedRolls.length > 0) {
                    const insertPromises = completedRolls.map(roll => {
                        return supabaseClient
                            .from('stages')
                            .insert([
                                { 
                                    order_number: itemData.order_number,
                                    stage: nextStage,
                                    status: 'Ожидание',
                                    shelf: roll.shelf,
                                    blocks: roll.blocks
                                }
                            ]);
                    });

                    await Promise.all(insertPromises);
                }

                showMessage(`Все рулоны на Каттере завершены! Заказ переведён на ${nextStageName}`, 'ok');
            } else {
                showMessage(`Рулон ${itemData.shelf} завершён. Осталось ещё ${count} рулон(ов) на Каттере`, 'ok');
            }
        } else {
            showMessage('Рулон обновлён', 'ok');
        }

        loadRolls();
    }

    document.addEventListener('DOMContentLoaded', loadRolls);
</script>
</body>
</html>
