<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Раскрой</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Science Gothic', sans-serif; 
            background: #ffffff; 
            color: #161616; 
            padding: 16px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
        }
        a { text-decoration: none; }

        .container { max-width: 1520px; width: 100%; }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid #eeeeee;
        }
        .header .title { font-size: 20px; letter-spacing: 0.5px; color: #161616; }
        .header .subtitle { font-size: 16px; color: #161616; cursor: pointer; transition: 0.2s; }
        .header .subtitle:hover { opacity: 0.7; }

        .stages {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 40px;
        }
        .stage-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            background: #cdcdcd;
            border-radius: 8px;
            color: #141414;
            font-size: 18px;
            transition: 0.2s;
        }
        .stage-btn:hover { background: #b0b0b0; }
        .stage-btn.active { background: #1e1e1e; color: #ffffff; }

        .page-title { font-size: 32px; margin-bottom: 24px; color: #161616; }
        
        .grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 1200px;
            width: 100%;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            align-items: center; 
            gap: 16px 24px;
        }

        .col {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .col .label { font-size: 18px; color: #161616; }
        .col .value {
            display: flex;
            align-items: center;
            padding: 0 12px;
            border: 1px solid #6c6c6c;
            border-radius: 8px;
            font-family: 'Science Gothic', sans-serif;
            font-size: 15px;
            background: #fff;
            height: 40px;
        }

        .col-order { width: 160px; }
        .col-type { width: 100px; }
        .col-id { width: 160px; }
        .col-shelf { width: 160px; }
        .col-blocks { width: 160px; }
        .col-status { width: 200px; }
        .col-actions { width: 160px; }

        .status-wait { 
            background: #e0e0e0 !important; 
            border-color: #b0b0b0 !important; 
            color: #555 !important; 
        }
        .status-work { 
            background: #ffe066 !important; 
            border-color: #d4b300 !important; 
            color: #1a1a1a !important; 
        }

        .btn-green {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            height: 40px;
            width: 160px;
            background-color: #0f8653;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            box-sizing: border-box;
        }
        .btn-green:hover { opacity: 0.8; }
        .btn-red {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            height: 40px;
            width: 160px;
            background-color: #e74c3c;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            box-sizing: border-box;
        }
        .btn-red:hover { opacity: 0.8; }

        .btn-refresh {
            width: 100%;
            padding: 12px;
            background: #eef1f4;
            border-radius: 8px;
            color: #333;
            font-size: 14px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-refresh:hover { background: #dce0e4; }

        .msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @media (max-width: 992px) {
            .row { align-items: flex-start; }
            .col-order, .col-type, .col-id, .col-shelf, .col-blocks, .col-status, .col-actions { width: 100%; max-width: 100%; }
            .btn-green, .btn-red { width: 100%; }
        }
        @media (max-width: 600px) {
            .header .title { font-size: 16px; }
            .header .subtitle { font-size: 14px; }
            .stage-btn { font-size: 14px; padding: 6px 12px; }
            .page-title { font-size: 26px; }
            .btn-green, .btn-red { width: 100%; height: 36px; }
            .col .value { height: 36px; }
        }
        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .col .label { font-size: 16px; }
            .col .value { font-size: 13px; height: 32px; }
            .btn-green, .btn-red { height: 32px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">//ПЛАНИРОВЩИК ПРОИЗВОДСТВА</div>
        <a href="/planner-app/" class="subtitle">ГЛАВНАЯ//</a>
    </div>
    <div id="message" class="msg"></div>

    <div class="stages">
        <a href="/planner-app/create.html" class="stage-btn">Создание заказа</a>
        <a href="/planner-app/prep.html" class="stage-btn">Подготовка</a>
        <a href="/planner-app/print.html" class="stage-btn">Печать</a>
        <a href="/planner-app/cutter.html" class="stage-btn">Каттер</a>
        <a href="/planner-app/cutting.html" class="stage-btn active">Раскрой</a>
        <a href="/planner-app/resin.html" class="stage-btn">Смола</a>
        <a href="/planner-app/drying.html" class="stage-btn">Сушка</a>
        <a href="/planner-app/otk.html" class="stage-btn">ОТК</a>
        <a href="/planner-app/packing.html" class="stage-btn">Упаковка</a>
    </div>

    <div class="page-title">Очередь в раскрой</div>
    <div class="grid" id="list">
        <div style="text-align: center; padding: 40px 0; color: #999;">Загрузка...</div>
    </div>
    <button class="btn-refresh" onclick="loadCuttingOrders()">Обновить</button>
</div>

<script>
    const SUPABASE_URL = 'https://knuqfyjdptkkdapivsnm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6k1bwNvlNAjNYI9NrijXtg_clTUDrOJ';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type) {
        var el = document.getElementById('message');
        el.textContent = text;
        el.className = 'msg show ' + type;
        setTimeout(function() { el.classList.remove('show'); }, 5000);
    }

    async function loadCuttingOrders() {
        const container = document.getElementById('list');
        container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Загрузка...</div>';

        let allItems = [];

        // 1. Загружаем рулоны (Р1) с этапа "Раскрой"
        const { data: rolls, error: rollsError } = await supabaseClient
            .from('rolls')
            .select('*')
            .in('status', ['Ожидание', 'В работе']);

        if (rollsError) {
            container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #c0392b;">Ошибка загрузки рулонов</div>';
            return;
        }

        // Помечаем рулоны как Р1
        if (rolls) {
            rolls.forEach(r => {
                allItems.push({
                    ...r,
                    type: 'Р1',
                    shelf: null
                });
            });
        }

        // 2. Загружаем заказы со стеллажами (Р2) из stages
        const { data: stages, error: stagesError } = await supabaseClient
            .from('stages')
            .select('*')
            .in('stage', ['Раскрой Р2', 'Раскрой'])
            .in('status', ['Ожидание', 'В работе']);

        if (stagesError) {
            container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #c0392b;">Ошибка загрузки стеллажей</div>';
            return;
        }

        if (stages) {
            for (const s of stages) {
                const { data: order, error: orderError } = await supabaseClient
                    .from('orders')
                    .select('blocks')
                    .eq('order_number', s.order_number)
                    .single();

                if (!orderError && order) {
                    allItems.push({
                        id: s.id,
                        order_number: s.order_number,
                        roll_index: null,
                        blocks: order.blocks || 0,
                        status: s.status,
                        type: 'Р2',
                        shelf: s.shelf || '—'
                    });
                }
            }
        }

        allItems.sort((a, b) => {
            if (a.status === 'Ожидание' && b.status !== 'Ожидание') return -1;
            if (a.status !== 'Ожидание' && b.status === 'Ожидание') return 1;
            return 0;
        });

        if (allItems.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Нет заказов на раскрое</div>';
            return;
        }

        let html = '';
        allItems.forEach(item => {
            const rollId = item.roll_index !== null ? `${item.order_number}_${String(item.roll_index).padStart(2, '0')}` : '';
            
            let statusClass = 'status-wait';
            let statusText = 'Ожидает';
            if (item.status === 'В работе') {
                statusClass = 'status-work';
                statusText = 'В работе';
            }

            const idOrShelf = item.type === 'Р1' ? rollId : item.shelf;

            html += `
                <div class="row">
                    <div class="col col-order">
                        <div class="label">№ заказа</div>
                        <div class="value">${item.order_number}</div>
                    </div>
                    <div class="col col-type">
                        <div class="label">Тип</div>
                        <div class="value">${item.type}</div>
                    </div>
                    <div class="col ${item.type === 'Р1' ? 'col-id' : 'col-shelf'}">
                        <div class="label">${item.type === 'Р1' ? 'ID рулона' : 'Стеллаж'}</div>
                        <div class="value">${idOrShelf}</div>
                    </div>
                    <div class="col col-blocks">
                        <div class="label">Кол-во блоков</div>
                        <div class="value">${item.blocks}</div>
                    </div>
                    <div class="col col-status">
                        <div class="label">Статус</div>
                        <div class="value ${statusClass}">${statusText}</div>
                    </div>
                    <div class="col col-actions">
                        <div class="label">&nbsp;</div>
                        ${item.status === 'Ожидание' 
                            ? `<button class="btn-green" onclick="updateCuttingItem('${item.id}', '${item.type}')">Взять в работу</button>` 
                            : `<button class="btn-red" onclick="updateCuttingItem('${item.id}', '${item.type}')">Завершить</button>`
                        }
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    async function updateCuttingItem(id, type) {
        let orderNumber = null;

        if (type === 'Р1') {
            // Получаем номер заказа из рулона
            const { data: rollData } = await supabaseClient
                .from('rolls')
                .select('order_number')
                .eq('id', id)
                .single();
            if (rollData) orderNumber = rollData.order_number;

            // Обновляем статус рулона
            const { error } = await supabaseClient
                .from('rolls')
                .update({ status: 'Выполнено' })
                .eq('id', id);
            if (error) {
                showMessage('Ошибка обновления рулона', 'err');
                return;
            }
        } else if (type === 'Р2') {
            // Получаем номер заказа из этапа
            const { data: stageData } = await supabaseClient
                .from('stages')
                .select('order_number')
                .eq('id', id)
                .single();
            if (stageData) orderNumber = stageData.order_number;

            // Обновляем статус этапа
            const { error } = await supabaseClient
                .from('stages')
                .update({ status: 'Выполнено' })
                .eq('id', id);
            if (error) {
                showMessage('Ошибка обновления этапа', 'err');
                return;
            }
        }

        // Если есть номер заказа — проверяем, все ли завершены
        if (orderNumber) {
            // Считаем оставшиеся рулоны Р1 (они в rolls)
            const { count: rollCount } = await supabaseClient
                .from('rolls')
                .select('*', { count: 'exact', head: true })
                .eq('order_number', orderNumber)
                .neq('status', 'Выполнено');

            // Считаем оставшиеся этапы Р2 (они в stages)
            const { count: stageCount } = await supabaseClient
                .from('stages')
                .select('*', { count: 'exact', head: true })
                .eq('order_number', orderNumber)
                .in('stage', ['Раскрой', 'Раскрой Р2'])
                .neq('status', 'Выполнено');

            const remaining = (rollCount || 0) + (stageCount || 0);

            // Если ничего не осталось — переходим на следующий этап
            if (remaining === 0) {
                // Закрываем текущий этап в stages
                await supabaseClient
                    .from('stages')
                    .update({ status: 'Выполнено' })
                    .eq('order_number', orderNumber)
                    .eq('stage', 'Раскрой');

                // Получаем данные заказа для маршрута
                const { data: order } = await supabaseClient
                    .from('orders')
                    .select('r1, resin, r2')
                    .eq('order_number', orderNumber)
                    .single();

                let nextStage = 'ОТК';
                let nextStageName = 'ОТК';

                // ЛОГИКА МАРШРУТА: если R1 = true, идём на Смолу
                if (order && (order.r1 === true)) {
                    nextStage = 'Смола';
                    nextStageName = 'Смола';
                } else if (order && (order.r2 === true)) {
                    nextStage = 'Раскрой Р2';
                    nextStageName = 'Раскрой Р2';
                }

                // Создаём следующий этап в stages
                await supabaseClient
                    .from('stages')
                    .insert([
                        { 
                            order_number: orderNumber, 
                            stage: nextStage, 
                            status: 'Ожидание'
                        }
                    ]);

                // Обновляем заказ
                await supabaseClient
                    .from('orders')
                    .update({ stage: nextStage, status: 'Ожидание' })
                    .eq('order_number', orderNumber);

                showMessage(`Все завершены! Заказ переведён на ${nextStageName}`, 'ok');
            } else {
                showMessage(`Осталось выполнить: ${remaining}`, 'ok');
            }
        }

        loadCuttingOrders();
    }

    document.addEventListener('DOMContentLoaded', loadCuttingOrders);
</script>
</body>
</html>
