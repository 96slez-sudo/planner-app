<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Раскрой — Планировщик</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f4f6f9; padding: 16px; min-height: 100vh; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; }
        .header { margin-bottom: 16px; }
        .header h1 { font-size: 22px; font-weight: 600; color: #1a1a2e; }
        .header p { font-size: 14px; color: #888; }
        .nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; background: white; padding: 8px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .nav a { padding: 6px 12px; background: #eef1f4; border-radius: 16px; text-decoration: none; font-size: 12px; color: #555; font-weight: 500; }
        .nav a:hover { background: #dce0e4; }
        .nav a.active { background: #2c3e50; color: white; }
        .card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eaeef2; }
        .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: #1a1a2e; }
        .btn { padding: 8px 16px; background: #2c3e50; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #1a252f; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn-success { background: #27ae60; }
        .btn-success:hover { background: #1e8449; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .badge { display: inline-block; padding: 3px 12px; border-radius: 16px; font-size: 12px; font-weight: 500; }
        .badge-waiting { background: #fff3cd; color: #856404; }
        .badge-work { background: #cce5ff; color: #004085; }
        .badge-done { background: #d4edda; color: #155724; }
        .item { padding: 12px 0; border-bottom: 1px solid #f0f2f5; }
        .item:last-child { border-bottom: none; }
        .item .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .item .order-num { font-weight: 600; font-size: 15px; color: #1a1a2e; }
        .item .order-meta { font-size: 14px; color: #666; }
        .item .actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .msg { padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .empty { text-align: center; padding: 28px 0; color: #aaa; font-size: 14px; }
        .loading { text-align: center; padding: 16px 0; color: #999; font-size: 14px; }
        @media (max-width: 480px) {
            body { padding: 12px; }
            .card { padding: 14px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Раскрой</h1>
        <p>Очередь рулонов (Р1) и заказов (Р2)</p>
    </div>
    <div class="nav">
    <a href="/planner-app/" class="active">Главная</a>
    <a href="/planner-app/prep.html">Подготовка</a>
    <a href="/planner-app/print.html">Печать</a>
    <a href="/planner-app/cutter.html">Каттер</a>
    <a href="/planner-app/cutting.html">Раскрой</a>
    <a href="/planner-app/resin.html">Смола</a>
    <a href="/planner-app/drying.html">Сушка</a>
    <a href="/planner-app/otk.html">ОТК</a>
    <a href="/planner-app/packing.html">Упаковка</a>
</div>
    </div>
    <div id="message" class="msg"></div>
    <div class="card">
        <h3>Очередь на раскрое</h3>
        <div id="cuttingList"></div>
        <button class="btn" style="width:100%; margin-top:10px; background:#eef1f4; color:#333;" onclick="loadCuttingOrders()">Обновить</button>
    </div>
</div>
<script>
    const SUPABASE_URL = 'https://knuqfyjdptkkdapivsnm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6k1bwNvlNAjNYI9NrijXtg_clTUDrOJ';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type) {
        var el = document.getElementById('message');
        el.textContent = text;
        el.className = 'msg show ' + type;
        setTimeout(function() { el.classList.remove('show'); }, 5000);
    }

    async function loadCuttingOrders() {
        var container = document.getElementById('cuttingList');
        container.innerHTML = '<div class="loading">Загрузка...</div>';

        const { data: stages, error: stageError } = await supabaseClient
            .from('stages')
            .select('*')
            .eq('stage', 'Раскрой')
            .eq('status', 'Ожидание');

        if (stageError) {
            container.innerHTML = '<div class="empty">Ошибка этапов: ' + stageError.message + '</div>';
            return;
        }
        if (!stages || stages.length === 0) {
            container.innerHTML = '<div class="empty">Нет заказов на раскрое</div>';
            return;
        }

        var allRolls = [];
        for (var s of stages) {
            const { data: rolls, error: rollError } = await supabaseClient
                .from('rolls')
                .select('*')
                .eq('order_number', s.order_number)
                .neq('status', 'Выполнено');

            if (!rollError && rolls) {
                allRolls = allRolls.concat(rolls);
            }
        }

        if (allRolls.length === 0) {
            container.innerHTML = '<div class="empty">Все рулоны завершены</div>';
            return;
        }

        var html = '';
        allRolls.forEach(function(item) {
            var badgeClass = '';
            var statusText = item.status || 'Ожидание';
            if (statusText === 'Ожидание') badgeClass = 'badge-waiting';
            else if (statusText === 'В работе') badgeClass = 'badge-work';
            else if (statusText === 'Выполнено') badgeClass = 'badge-done';

            html += '<div class="item">';
            html += '  <div class="head">';
            html += '    <span class="order-num">№ ' + item.order_number + ' — Р' + item.roll_index + '</span>';
            html += '    <span class="badge ' + badgeClass + '">' + statusText + '</span>';
            html += '  </div>';
            html += '  <div class="order-meta">Блоков: ' + item.blocks + '</div>';
            html += '  <div class="actions">';
            if (statusText === 'Ожидание') {
                html += '    <button class="btn btn-sm btn-success" onclick="updateCuttingRoll(\'' + item.id + '\', \'В работе\')">Взять в работу</button>';
            } else if (statusText === 'В работе') {
                html += '    <button class="btn btn-sm btn-danger" onclick="updateCuttingRoll(\'' + item.id + '\', \'Выполнено\')">Завершить</button>';
            }
            html += '  </div>';
            html += '</div>';
        });
        container.innerHTML = html;
    }

    async function updateCuttingRoll(rollId, newStatus) {
        const { data: rollData, error: getError } = await supabaseClient
            .from('rolls')
            .select('order_number')
            .eq('id', rollId)
            .single();
        if (getError || !rollData) {
            showMessage('Ошибка получения заказа', 'err');
            return;
        }
        var orderNumber = rollData.order_number;

        const { error: updateError } = await supabaseClient
            .from('rolls')
            .update({ status: newStatus })
            .eq('id', rollId);
        if (updateError) {
            showMessage('Ошибка обновления рулона', 'err');
            return;
        }

        const { data: remaining, error: countError } = await supabaseClient
            .from('rolls')
            .select('id', { count: 'exact' })
            .eq('order_number', orderNumber)
            .neq('status', 'Выполнено');

        if (countError) {
            showMessage('Ошибка подсчёта рулонов', 'err');
            return;
        }

        if (remaining.length === 0) {
            // Получаем данные заказа, чтобы понять его маршрут
            const { data: orderData, error: orderError } = await supabaseClient
                .from('orders')
                .select('resin, r2, path')
                .eq('order_number', orderNumber)
                .single();

            if (orderError) {
                showMessage('Ошибка получения данных заказа', 'err');
                return;
            }

            await supabaseClient
                .from('stages')
                .update({ status: 'Выполнено' })
                .eq('order_number', orderNumber)
                .eq('stage', 'Раскрой');

            // Определяем следующий этап в зависимости от чекбоксов
            var nextStage = 'ОТК';
            var nextStageName = 'ОТК';

            if (orderData.resin) {
                nextStage = 'Смола';
                nextStageName = 'Смола';
            } else if (orderData.r2) {
                nextStage = 'Раскрой Р2';
                nextStageName = 'Раскрой Р2';
            }

            await supabaseClient
                .from('stages')
                .insert([
                    { order_number: orderNumber, stage: nextStage, status: 'Ожидание' }
                ]);

            await supabaseClient
                .from('orders')
                .update({ stage: nextStage, status: 'В работе' })
                .eq('order_number', orderNumber);

            showMessage('Все рулоны завершены! Заказ переведён на ' + nextStageName, 'ok');
        } else {
            showMessage('Рулон обновлён. Осталось ещё ' + remaining.length + ' рулонов', 'ok');
        }

        loadCuttingOrders();
    }

    document.addEventListener('DOMContentLoaded', function() { loadCuttingOrders(); });
</script>
</body>
</html>
