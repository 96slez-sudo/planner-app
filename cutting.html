<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Раскрой</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Science Gothic', sans-serif; 
            background: #ffffff; 
            color: #161616; 
            padding: 16px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
        }
        a { text-decoration: none; }

        .container { max-width: 1520px; width: 100%; }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid #eeeeee;
        }
        .header .title { font-size: 20px; letter-spacing: 0.5px; color: #161616; }
        .header .subtitle { font-size: 16px; color: #161616; cursor: pointer; transition: 0.2s; }
        .header .subtitle:hover { opacity: 0.7; }

        .stages {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 40px;
        }
        .stage-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            background: #cdcdcd;
            border-radius: 8px;
            color: #141414;
            font-size: 18px;
            transition: 0.2s;
        }
        .stage-btn:hover { background: #b0b0b0; }
        .stage-btn.active { background: #1e1e1e; color: #ffffff; }

        .page-title { font-size: 32px; margin-bottom: 24px; color: #161616; }
        
        .grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 1200px;
            width: 100%;
        }

        /* Хедер таблицы */
        .table-header {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 16px;
            padding: 8px 0 12px 0;
            border-bottom: 2px solid #d1d5db;
            font-weight: 600;
            font-size: 14px;
            color: #555;
            letter-spacing: 0.3px;
        }
        .table-header .col-label {
            flex-shrink: 0;
            text-align: left;
        }
        .col-label-shelf { width: 200px; }
        .col-label-order { width: 120px; }
        .col-label-type { width: 160px; }
        .col-label-blocks { width: 130px; }
        .col-label-status { width: 140px; }
        .col-label-actions { width: 160px; }

        /* Строка данных */
        .row {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 6px 0;
            border-bottom: 1px solid #eeeeee;
            min-height: 52px;
        }
        .row:last-child { border-bottom: none; }

        .col {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex-shrink: 0;
        }
        .col .value {
            display: flex;
            align-items: center;
            padding: 0 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-family: 'Science Gothic', sans-serif;
            font-size: 14px;
            background: #fff;
            height: 36px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-shelf { width: 200px; flex-shrink: 0; }
        .col-order { width: 120px; flex-shrink: 0; }
        .col-type { width: 160px; flex-shrink: 0; }
        .col-blocks { width: 130px; flex-shrink: 0; }
        .col-status { width: 140px; flex-shrink: 0; }
        .col-actions { width: 160px; flex-shrink: 0; }

        .status-wait { background: #e0e0e0 !important; border-color: #b0b0b0 !important; color: #555 !important; }
        .status-work { background: #ffe066 !important; border-color: #d4b300 !important; color: #1a1a1a !important; }

        .btn-green {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            height: 36px;
            width: 100%;
            background-color: #0f8653;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .btn-green:hover { opacity: 0.8; }
        .btn-red {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            height: 36px;
            width: 100%;
            background-color: #e74c3c;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .btn-red:hover { opacity: 0.8; }

        .btn-refresh {
            width: 100%;
            max-width: 1200px;
            padding: 12px;
            background: #eef1f4;
            border-radius: 8px;
            color: #333;
            font-size: 14px;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-refresh:hover { background: #dce0e4; }

        .msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @media (max-width: 1100px) {
            .table-header { display: none; }
            .row { flex-wrap: wrap; gap: 10px; }
            .col-shelf { width: 100%; }
            .col-order { width: calc(50% - 5px); }
            .col-type { width: calc(50% - 5px); }
            .col-blocks { width: calc(33.33% - 7px); }
            .col-status { width: calc(33.33% - 7px); }
            .col-actions { width: calc(33.33% - 7px); }
        }
        @media (max-width: 600px) {
            .header .title { font-size: 16px; }
            .header .subtitle { font-size: 14px; }
            .stage-btn { font-size: 14px; padding: 6px 12px; }
            .page-title { font-size: 26px; }
            .col .value { font-size: 13px; height: 32px; }
            .col-order, .col-type, .col-blocks, .col-status, .col-actions { width: 100%; }
            .btn-green, .btn-red { height: 32px; }
        }
        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .col .value { font-size: 12px; height: 30px; }
            .btn-green, .btn-red { height: 30px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">//ПЛАНИРОВЩИК ПРОИЗВОДСТВА</div>
        <a href="/planner-app/" class="subtitle">ГЛАВНАЯ//</a>
    </div>
    <div id="message" class="msg"></div>

    <div class="stages">
        <a href="/planner-app/create.html" class="stage-btn">Создание заказа</a>
        <a href="/planner-app/prep.html" class="stage-btn">Подготовка</a>
        <a href="/planner-app/print.html" class="stage-btn">Печать</a>
        <a href="/planner-app/cutter.html" class="stage-btn">Каттер</a>
        <a href="/planner-app/cutting.html" class="stage-btn active">Раскрой</a>
        <a href="/planner-app/resin.html" class="stage-btn">Смола</a>
        <a href="/planner-app/drying.html" class="stage-btn">Сушка</a>
        <a href="/planner-app/otk.html" class="stage-btn">ОТК</a>
        <a href="/planner-app/packing.html" class="stage-btn">Упаковка</a>
    </div>

    <div class="page-title">Очередь на раскрое</div>
    <div class="grid" id="list">
        <div style="text-align: center; padding: 40px 0; color: #999;">Загрузка заказов...</div>
    </div>
    <button class="btn-refresh" onclick="loadCuttingOrders()">Обновить</button>
</div>

<script>
    const SUPABASE_URL = 'https://knuqfyjdptkkdapivsnm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6k1bwNvlNAjNYI9NrijXtg_clTUDrOJ';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type) {
        var el = document.getElementById('message');
        el.textContent = text;
        el.className = 'msg show ' + type;
        setTimeout(function() { el.classList.remove('show'); }, 5000);
    }

    // Функция для получения общего количества блоков заказа
    async function getTotalBlocksForOrder(orderNumber) {
        const { data, error } = await supabaseClient
            .from('rolls')
            .select('blocks')
            .eq('order_number', orderNumber);

        if (error || !data) {
            console.error('Ошибка получения блоков:', error);
            return 0;
        }

        let total = 0;
        data.forEach(r => { total += (r.blocks || 0); });
        return total;
    }

    // Функция для получения общего количества рулонов заказа
    async function getTotalRollsForOrder(orderNumber) {
        const { data, error } = await supabaseClient
            .from('rolls')
            .select('id')
            .eq('order_number', orderNumber);

        if (error || !data) {
            console.error('Ошибка получения рулонов:', error);
            return 0;
        }
        return data.length;
    }

    async function loadCuttingOrders() {
        const container = document.getElementById('list');
        container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Загрузка...</div>';

        const { data, error } = await supabaseClient
            .from('stages')
            .select('*')
            .eq('stage', 'Раскрой')
            .in('status', ['Ожидание', 'В работе']);

        if (error) {
            container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #c0392b;">Ошибка загрузки</div>';
            return;
        }
        if (!data || data.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Нет заказов на раскрое</div>';
            return;
        }

        const sorted = [...data].sort((a, b) => {
            const shelfA = a.shelf || '';
            const shelfB = b.shelf || '';
            if (shelfA < shelfB) return -1;
            if (shelfA > shelfB) return 1;
            const orderA = a.order_number || '';
            const orderB = b.order_number || '';
            return orderA.localeCompare(orderB);
        });

        // Заголовки таблицы
        let html = `
            <div class="table-header">
                <div class="col-label col-label-shelf">ID рулона / Стеллаж</div>
                <div class="col-label col-label-order">№ заказа</div>
                <div class="col-label col-label-type">Тип</div>
                <div class="col-label col-label-blocks">Кол-во блоков</div>
                <div class="col-label col-label-status">Статус</div>
                <div class="col-label col-label-actions"></div>
            </div>
        `;

        for (const item of sorted) {
            const displayId = item.shelf || '—';
            
            // Используем route_type из таблицы stages
            const routeType = item.route_type || 'Р1';
            
            // Определяем тип для отображения
            let typeDisplay = routeType;

            let statusClass = 'status-wait';
            let statusText = 'Ожидает';
            if (item.status === 'В работе') {
                statusClass = 'status-work';
                statusText = 'В работе';
            }

            html += `
                <div class="row">
                    <div class="col col-shelf">
                        <div class="value" title="${displayId}">${displayId}</div>
                    </div>
                    <div class="col col-order">
                        <div class="value">${item.order_number}</div>
                    </div>
                    <div class="col col-type">
                        <div class="value" style="font-size: 12px;" title="${typeDisplay}">${typeDisplay}</div>
                    </div>
                    <div class="col col-blocks">
                        <div class="value">${item.blocks || 0}</div>
                    </div>
                    <div class="col col-status">
                        <div class="value ${statusClass}">${statusText}</div>
                    </div>
                    <div class="col col-actions">
                        ${item.status === 'Ожидание' 
                            ? `<button class="btn-green" onclick="updateCuttingOrder('${item.id}', 'В работе')">Взять в работу</button>` 
                            : `<button class="btn-red" onclick="updateCuttingOrder('${item.id}', 'Выполнено')">Завершить</button>`
                        }
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    async function updateCuttingOrder(stageId, newStatus) {
        const { data: stageData, error: getError } = await supabaseClient
            .from('stages')
            .select('order_number, shelf, blocks, route_type')
            .eq('id', stageId)
            .single();

        if (getError || !stageData) {
            showMessage('Ошибка получения данных этапа', 'err');
            return;
        }

        // Используем route_type из stages
        const routeType = stageData.route_type || 'Р1';

        const { error: updateError } = await supabaseClient
            .from('stages')
            .update({ status: newStatus })
            .eq('id', stageId);

        if (updateError) {
            showMessage('Ошибка обновления статуса', 'err');
            return;
        }

        if (newStatus === 'Выполнено') {
            // Проверяем, есть ли еще активные записи на раскрое для этого заказа
            const { count, error: countError } = await supabaseClient
                .from('stages')
                .select('*', { count: 'exact', head: true })
                .eq('order_number', stageData.order_number)
                .eq('stage', 'Раскрой')
                .neq('status', 'Выполнено');

            if (countError) {
                showMessage('Ошибка подсчёта оставшихся', 'err');
                return;
            }

            // ЛОГИКА В ЗАВИСИМОСТИ ОТ ТИПА ЗАКАЗА
            if (routeType === 'Р2') {
                // Р2: каждый рулон создает/обновляет запись на ОТК
                const totalBlocks = await getTotalBlocksForOrder(stageData.order_number);
                const totalRolls = await getTotalRollsForOrder(stageData.order_number);
                
                // Получаем все выполненные рулоны на раскрое для этого заказа
                const { data: completedRolls, error: completedError } = await supabaseClient
                    .from('stages')
                    .select('id')
                    .eq('order_number', stageData.order_number)
                    .eq('stage', 'Раскрой')
                    .eq('status', 'Выполнено');

                if (completedError) {
                    showMessage('Ошибка получения завершенных рулонов', 'err');
                    return;
                }

                // Текущий номер завершенного рулона (включая этот)
                const currentCount = completedRolls ? completedRolls.length + 1 : 1;
                
                // Формируем completion_note: "1/3", "2/3", "3/3"
                const completionNote = `${currentCount}/${totalRolls}`;

                // Проверяем, есть ли уже запись на ОТК для этого заказа
                const { data: existingOtk, error: otkCheckError } = await supabaseClient
                    .from('otk_orders')
                    .select('id')
                    .eq('order_number', stageData.order_number)
                    .maybeSingle();

                if (otkCheckError) {
                    showMessage('Ошибка проверки ОТК', 'err');
                    return;
                }

                if (existingOtk) {
                    // Обновляем существующую запись
                    await supabaseClient
                        .from('otk_orders')
                        .update({ 
                            total_blocks: totalBlocks,
                            completion_note: completionNote 
                        })
                        .eq('id', existingOtk.id);
                } else {
                    // Создаем новую запись на ОТК
                    await supabaseClient
                        .from('otk_orders')
                        .insert([
                            { 
                                order_number: stageData.order_number,
                                total_blocks: totalBlocks,
                                completion_note: completionNote,
                                status: 'Ожидание'
                            }
                        ]);
                }

                // Если это был последний рулон, обновляем orders
                if (count === 0) {
                    await supabaseClient
                        .from('orders')
                        .update({ stage: 'ОТК' })
                        .eq('order_number', stageData.order_number);
                    
                    showMessage(`Последний рулон Р2 завершен! Заказ ${stageData.order_number} отправлен на ОТК (${completionNote})`, 'ok');
                } else {
                    showMessage(`Рулон ${stageData.shelf} завершен (${completionNote}). Осталось ${count} рулон(ов) на раскрое.`, 'ok');
                }

            } else if (routeType === 'Р1+Смола' || routeType === 'Р1+Смола+Р2') {
                // Р1 с смолой: после раскроя на Смолу (когда все части завершены)
                if (count === 0) {
                    // Все части завершены - идем на Смолу
                    const { data: completedItems } = await supabaseClient
                        .from('stages')
                        .select('shelf, blocks')
                        .eq('order_number', stageData.order_number)
                        .eq('stage', 'Раскрой')
                        .eq('status', 'Выполнено');

                    if (completedItems && completedItems.length > 0) {
                        const insertPromises = completedItems.map(item => {
                            return supabaseClient
                                .from('stages')
                                .insert([
                                    { 
                                        order_number: stageData.order_number, 
                                        stage: 'Смола', 
                                        status: 'Ожидание',
                                        shelf: item.shelf,
                                        blocks: item.blocks,
                                        route_type: routeType
                                    }
                                ]);
                        });
                        await Promise.all(insertPromises);
                    }

                    await supabaseClient
                        .from('orders')
                        .update({ stage: 'Смола' })
                        .eq('order_number', stageData.order_number);

                    showMessage(`Все части завершены! Заказ ${stageData.order_number} переведён на Смолу`, 'ok');
                } else {
                    showMessage(`Стеллаж ${stageData.shelf} завершён. Осталось ещё ${count} частей на раскрое.`, 'ok');
                }

            } else {
                // Р1 (без смолы): после раскроя на ОТК (когда все части завершены)
                if (count === 0) {
                    const totalBlocks = await getTotalBlocksForOrder(stageData.order_number);
                    const totalRolls = await getTotalRollsForOrder(stageData.order_number);

                    await supabaseClient
                        .from('otk_orders')
                        .insert([
                            { 
                                order_number: stageData.order_number,
                                total_blocks: totalBlocks,
                                completion_note: `${totalRolls}/${totalRolls}`,
                                status: 'Ожидание'
                            }
                        ]);

                    await supabaseClient
                        .from('orders')
                        .update({ stage: 'ОТК' })
                        .eq('order_number', stageData.order_number);

                    showMessage(`Все части завершены! Заказ ${stageData.order_number} отправлен на ОТК (${totalRolls}/${totalRolls})`, 'ok');
                } else {
                    showMessage(`Стеллаж ${stageData.shelf} завершён. Осталось ещё ${count} частей на раскрое.`, 'ok');
                }
            }

        } else {
            showMessage('Статус обновлён', 'ok');
        }

        loadCuttingOrders();
    }

    document.addEventListener('DOMContentLoaded', loadCuttingOrders);
</script>
</body>
</html>
