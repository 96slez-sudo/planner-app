<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Подготовка печати — Планировщик</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f4f6f9; padding: 16px; min-height: 100vh; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; }
        .header { margin-bottom: 16px; }
        .header h1 { font-size: 22px; font-weight: 600; color: #1a1a2e; }
        .header p { font-size: 14px; color: #888; }
        .nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; background: white; padding: 8px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .nav a { padding: 6px 12px; background: #eef1f4; border-radius: 16px; text-decoration: none; font-size: 12px; color: #555; font-weight: 500; }
        .nav a:hover { background: #dce0e4; }
        .nav a.active { background: #2c3e50; color: white; }
        .card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eaeef2; }
        .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 14px; color: #1a1a2e; }
        .field { margin-bottom: 10px; }
        .field label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 4px; }
        .field input { width: 100%; padding: 10px 12px; border: 1.5px solid #dce0e5; border-radius: 8px; font-size: 15px; background: #fafbfc; }
        .field input:focus { outline: none; border-color: #2c3e50; background: white; }
        .btn { padding: 8px 16px; background: #2c3e50; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #1a252f; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .btn-success { background: #27ae60; }
        .btn-success:hover { background: #1e8449; }
        .badge { display: inline-block; padding: 3px 12px; border-radius: 16px; font-size: 12px; font-weight: 500; }
        .badge-waiting { background: #fff3cd; color: #856404; }
        .item { padding: 12px 0; border-bottom: 1px solid #f0f2f5; }
        .item:last-child { border-bottom: none; }
        .item .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .item .order-num { font-weight: 600; font-size: 15px; color: #1a1a2e; }
        .item .order-meta { font-size: 14px; color: #666; }
        .item .actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
        .roll-row { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
        .roll-row .r { display: flex; flex-direction: column; align-items: center; }
        .roll-row .r label { font-size: 10px; color: #888; }
        .roll-row .r input { width: 42px; padding: 4px; border: 1.5px solid #dce0e5; border-radius: 4px; text-align: center; font-size: 14px; }
        .msg { padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .empty { text-align: center; padding: 28px 0; color: #aaa; font-size: 14px; }
        .loading { text-align: center; padding: 16px 0; color: #999; font-size: 14px; }
        @media (max-width: 480px) {
            body { padding: 12px; }
            .card { padding: 14px; }
            .roll-row .r input { width: 36px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Подготовка печати</h1>
        <p>Создание рулонов</p>
    </div>
    <div class="nav">
        <a href="/planner-app/">Главная</a>
        <a href="/planner-app/prep.html" class="active">Подготовка</a>
        <a href="/planner-app/print.html">Печать</a>
        <a href="/planner-app/cutter.html">Каттер</a>
        <a href="/planner-app/cutting.html">Раскрой</a>
        <a href="/planner-app/resin.html">Смола</a>
        <a href="/planner-app/drying.html">Сушка</a>
        <a href="/planner-app/otk.html">ОТК</a>
        <a href="/planner-app/packing.html">Упаковка</a>
    </div>
    <div id="message" class="msg"></div>
    <div class="card">
        <h3>Заказы в подготовке</h3>
        <div id="prepList"></div>
        <button class="btn" style="width:100%; margin-top:10px; background:#eef1f4; color:#333;" onclick="loadPrepOrders()">Обновить</button>
    </div>
</div>
<script>
    const SUPABASE_URL = 'https://knuqfyjdptkkdapivsnm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6k1bwNvlNAjNYI9NrijXtg_clTUDrOJ';

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type) {
        var el = document.getElementById('message');
        el.textContent = text;
        el.className = 'msg show ' + type;
        setTimeout(function() { el.classList.remove('show'); }, 5000);
    }

    async function loadPrepOrders() {
        var container = document.getElementById('prepList');
        container.innerHTML = '<div class="loading">Загрузка...</div>';

        const { data, error } = await supabaseClient
            .from('orders')
            .select('*')
            .eq('status', 'Запущен');

        if (error) { container.innerHTML = '<div class="empty">Ошибка: ' + error.message + '</div>'; return; }
        if (!data || data.length === 0) { container.innerHTML = '<div class="empty">Нет заказов в подготовке</div>'; return; }

        var html = '';
        data.forEach(function(item) {
            html += '<div class="item">';
            html += '  <div class="head">';
            html += '    <span class="order-num">№ ' + item.order_number + '</span>';
            html += '    <span class="badge badge-waiting">' + (item.status || 'Ожидание') + '</span>';
            html += '  </div>';
            html += '  <div class="order-meta">Приоритет: ' + (item.priority || 'Обычный') + '</div>';
            html += '  <div class="roll-row" id="rolls-' + item.order_number + '">';
            for (var i = 1; i <= 6; i++) {
                html += '    <div class="r">';
                html += '      <label>Р' + i + '</label>';
                html += '      <input type="number" min="0" value="0" id="roll-' + item.order_number + '-' + i + '">';
                html += '    </div>';
            }
            html += '  </div>';
            html += '  <div class="actions">';
            html += '    <button class="btn btn-sm btn-success" onclick="createRolls(\'' + item.order_number + '\')">Создать рулоны</button>';
            html += '  </div>';
            html += '</div>';
        });
        container.innerHTML = html;
    }

    async function createRolls(orderNumber) {
        var totalBlocks = 0; var rolls = {}; var sum = 0;
        for (var i = 1; i <= 6; i++) {
            var val = parseInt(document.getElementById('roll-' + orderNumber + '-' + i).value) || 0;
            if (val > 0) { rolls['roll_' + i] = val; sum += val; }
        }
        if (sum === 0) { showMessage('Заполните хотя бы один рулон', 'err'); return; }

        // 1. Сохраняем каждый рулон в таблицу rolls
        var rollPromises = [];
        for (var key in rolls) {
            var index = parseInt(key.replace('roll_', ''));
            var blocks = rolls[key];
            rollPromises.push(
                supabaseClient
                    .from('rolls')
                    .insert([
                        { 
                            order_id: orderNumber, 
                            roll_index: index, 
                            blocks: blocks, 
                            status: 'Ожидание' 
                        }
                    ])
            );
        }
        await Promise.all(rollPromises);

        // 2. Обновляем статус заказа и пишем историю
        await supabaseClient
            .from('orders')
            .update({ status: 'На печати' })
            .eq('order_number', orderNumber);

        await supabaseClient
            .from('order_history')
            .insert([
                { 
                    order_id: orderNumber, 
                    stage: 'Подготовка', 
                    status: 'Завершено' 
                }
            ]);

        showMessage('Рулоны созданы, заказ переведён на печать', 'ok');
        loadPrepOrders();
    }

    document.addEventListener('DOMContentLoaded', function() { loadPrepOrders(); });
</script>
</body>
</html>
