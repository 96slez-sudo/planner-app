<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Печать — Планировщик</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f0f4f8; padding: 16px; min-height: 100vh; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; }
        
        .header { margin-bottom: 16px; }
        .header h1 { font-size: 24px; font-weight: 700; color: #1a1a2e; }
        .header p { font-size: 14px; color: #888; }
        
        .nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; background: white; padding: 8px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .nav a { padding: 8px 14px; background: #e8ecf0; border-radius: 20px; text-decoration: none; font-size: 13px; color: #555; font-weight: 500; transition: 0.2s; }
        .nav a:hover { background: #d0d4d8; }
        .nav a.active { background: #2c3e50; color: white; }
        
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid #eaeef2; }
        .card h3 { font-size: 17px; font-weight: 600; margin-bottom: 16px; color: #1a1a2e; display: flex; align-items: center; gap: 8px; }
        
        .btn { padding: 10px 20px; background: #2c3e50; color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #1a252f; }
        .btn:active { transform: scale(0.98); }
        .btn-sm { padding: 8px 16px; font-size: 13px; }
        .btn-success { background: #27ae60; }
        .btn-success:hover { background: #1e8449; }
        .btn-danger { background: #e74c3c; }
        .btn-danger:hover { background: #c0392b; }
        .btn-outline { background: transparent; color: #2c3e50; border: 1.5px solid #2c3e50; }
        .btn-outline:hover { background: #2c3e50; color: white; }
        
        .badge { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-waiting { background: #fff3cd; color: #856404; }
        .badge-work { background: #cce5ff; color: #004085; }
        .badge-done { background: #d4edda; color: #155724; }
        
        .item { padding: 14px 0; border-bottom: 1px solid #f0f2f5; }
        .item:last-child { border-bottom: none; }
        .item .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .item .order-num { font-weight: 600; font-size: 16px; color: #1a1a2e; }
        .item .order-meta { font-size: 14px; color: #666; margin-top: 4px; }
        .item .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
        
        .msg { padding: 14px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .empty { text-align: center; padding: 32px 0; color: #aaa; font-size: 14px; }
        .empty .icon { font-size: 40px; display: block; margin-bottom: 8px; }
        .loading { text-align: center; padding: 20px 0; color: #999; font-size: 14px; }
        
        @media (max-width: 480px) {
            body { padding: 12px; }
            .card { padding: 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🖨️ Печать</h1>
        <p>Очередь рулонов на печати</p>
    </div>

    <div class="nav">
        <a href="/planner-app/">Главная</a>
        <a href="/planner-app/prep.html">Подготовка</a>
        <a href="/planner-app/print.html" class="active">Печать</a>
        <a href="/planner-app/cutter.html">Каттер</a>
        <a href="/planner-app/cutting.html">Раскрой</a>
        <a href="/planner-app/resin.html">Смола</a>
        <a href="/planner-app/drying.html">Сушка</a>
        <a href="/planner-app/otk.html">ОТК</a>
        <a href="/planner-app/packing.html">Упаковка</a>
    </div>

    <div id="message" class="msg"></div>

    <div class="card">
        <h3>📋 Очередь рулонов</h3>
        <div id="rollsList"></div>
        <button class="btn" style="width:100%; margin-top:12px; font-size:14px; padding:10px; background:#e8ecf0; color:#333;" onclick="loadRolls()">🔄 Обновить</button>
    </div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxa8Ag_VFouB9IITEXP0XlcMtVMsG-MgeheLC3f38x_TDnLqpQGy7OmvyPxTPAcueFbcw/exec';

    function showMessage(text, type) {
        var el = document.getElementById('message');
        el.textContent = text;
        el.className = 'msg show ' + type;
        setTimeout(function() { el.classList.remove('show'); }, 5000);
    }

    function loadRolls() {
        var container = document.getElementById('rollsList');
        container.innerHTML = '<div class="loading">⏳ Загрузка...</div>';

        fetch(API_URL + '?action=getRolls&_=' + Date.now())
        .then(function(response) { return response.json(); })
        .then(function(result) {
            if (result.error) {
                container.innerHTML = '<div class="empty"><span class="icon">❌</span>Ошибка: ' + result.error + '</div>';
                return;
            }
            if (!result.data || result.data.length === 0) {
                container.innerHTML = '<div class="empty"><span class="icon">📭</span>Нет рулонов на печати</div>';
                return;
            }
            var rolls = result.data.filter(function(r) { return r.stage === 'Печать' && r.status !== 'Выполнено'; });
            if (rolls.length === 0) {
                container.innerHTML = '<div class="empty"><span class="icon">✅</span>Все рулоны выполнены</div>';
                return;
            }
            var html = '';
            rolls.forEach(function(item) {
                var badgeClass = '';
                var statusText = item.status || 'Ожидание';
                if (statusText === 'Ожидание') badgeClass = 'badge-waiting';
                else if (statusText === 'В работе') badgeClass = 'badge-work';
                else if (statusText === 'Выполнено') badgeClass = 'badge-done';

                html += '<div class="item">';
                html += '  <div class="head">';
                html += '    <span class="order-num">№ ' + item.order + ' — ' + item.rollId + '</span>';
                html += '    <span class="badge ' + badgeClass + '">' + statusText + '</span>';
                html += '  </div>';
                html += '  <div class="order-meta">📦 ' + item.blocks + ' блоков</div>';
                html += '  <div class="actions">';
                if (statusText === 'Ожидание') {
                    html += '    <button class="btn btn-sm btn-success" onclick="updateRoll(\'' + item.rollId + '\', \'В работе\')">▶ Взять в работу</button>';
                } else if (statusText === 'В работе') {
                    html += '    <button class="btn btn-sm btn-danger" onclick="updateRoll(\'' + item.rollId + '\', \'Выполнено\')">✅ Завершить</button>';
                }
                html += '  </div>';
                html += '</div>';
            });
            container.innerHTML = html;
        })
        .catch(function(err) {
            container.innerHTML = '<div class="empty"><span class="icon">❌</span>Ошибка: ' + err + '</div>';
        });
    }

    function updateRoll(rollId, newStatus) {
        var data = { action: 'updateRoll', rollId: rollId, status: newStatus };

        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(function() {
            showMessage('✅ Рулон ' + rollId + ' — ' + newStatus, 'ok');
            loadRolls();
        })
        .catch(function(err) {
            showMessage('❌ Ошибка: ' + err, 'err');
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadRolls();
    });
</script>

</body>
</html>
