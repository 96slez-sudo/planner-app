<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Печать</title>
    <!-- ПОДКЛЮЧЕНИЕ КРАСИВОГО ШРИФТА INTER -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', 'Asta Sans-Regular', sans-serif; 
            background: #ffffff; 
            color: #161616; 
            padding: 16px; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
        }
        a { text-decoration: none; }

        .container { max-width: 1520px; width: 100%; }

        /* --- Шапка --- */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            margin-bottom: 32px;
            border-bottom: 1px solid #eeeeee;
        }
        .header .title { font-size: 20px; letter-spacing: 0.5px; font-weight: 500; color: #161616; }
        .header .subtitle { font-size: 16px; font-weight: 400; color: #161616; cursor: pointer; transition: 0.2s; }
        .header .subtitle:hover { opacity: 0.7; }

        /* --- Меню --- */
        .stages {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 40px;
        }
        .stage-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 18px;
            background: #cdcdcd;
            border-radius: 8px;
            color: #141414;
            font-size: 18px;
            font-weight: 500;
            transition: 0.2s;
        }
        .stage-btn:hover { background: #b0b0b0; }
        .stage-btn.active {
            background: #1e1e1e;
            color: #ffffff;
        }

        /* --- Заголовок --- */
        .page-title { font-size: 32px; font-weight: 600; margin-bottom: 30px; color: #161616; }

        /* --- Таблица рулонов --- */
        .rolls-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1050px;
            width: 100%;
        }

        .roll-row {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 16px 24px;
        }

        .roll-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .roll-col .label { font-size: 18px; font-weight: 500; color: #161616; }
        .roll-col .value {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border: 1px solid #6c6c6c;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 400;
            background: #fff;
            min-height: 40px;
        }

        /* Фиксированные ширины колонок */
        .col-id { width: 180px; }
        .col-roll { width: 180px; }
        .col-blocks { width: 180px; }
        .col-status { width: 200px; }
        .col-actions { width: auto; flex: 0 0 auto; }

        /* Статусы */
        .status-badge {
            border: 1px solid #6c6c6c;
        }
        .status-wait { background: #cdcdcd; border-color: #cdcdcd; }
        .status-work { background: #ffe26f; border-color: #ffe26f; }

        /* Кнопки */
        .btn-green {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 16px;
            background-color: #0f8653;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-green:hover { opacity: 0.8; }
        .btn-red {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 16px;
            background-color: #e74c3c;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-red:hover { opacity: 0.8; }

        .btn-refresh {
            width: 100%;
            padding: 12px;
            background: #eef1f4;
            border-radius: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-refresh:hover { background: #dce0e4; }

        .msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
        .msg.show { display: block; }
        .msg.ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.err { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* --- Адаптивность --- */
        @media (max-width: 992px) {
            .roll-row { align-items: flex-start; }
            .col-id, .col-roll, .col-blocks, .col-status { width: 100%; max-width: 100%; }
            .col-actions { width: 100%; }
            .rolls-grid { max-width: 100%; }
        }
        @media (max-width: 600px) {
            .header .title { font-size: 16px; }
            .header .subtitle { font-size: 14px; }
            .stage-btn { font-size: 14px; padding: 6px 12px; }
            .page-title { font-size: 26px; font-weight: 600; }
            .btn-green, .btn-red { width: 100%; justify-content: center; }
        }
        @media (max-width: 480px) {
            .header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .roll-col .label { font-size: 16px; font-weight: 500; }
            .roll-col .value { font-size: 13px; min-height: 36px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">//ПЛАНИРОВЩИК ПРОИЗВОДСТВА</div>
        <a href="/planner-app/" class="subtitle">ГЛАВНАЯ//</a>
    </div>
    <div id="message" class="msg"></div>

    <div class="stages">
        <a href="/planner-app/create.html" class="stage-btn">Создание заказа</a>
        <a href="/planner-app/prep.html" class="stage-btn">Подготовка</a>
        <a href="/planner-app/print.html" class="stage-btn active">Печать</a>
        <a href="/planner-app/cutter.html" class="stage-btn">Каттер</a>
        <a href="/planner-app/cutting.html" class="stage-btn">Раскрой</a>
        <a href="/planner-app/resin.html" class="stage-btn">Смола</a>
        <a href="/planner-app/drying.html" class="stage-btn">Сушка</a>
        <a href="/planner-app/otk.html" class="stage-btn">ОТК</a>
        <a href="/planner-app/packing.html" class="stage-btn">Упаковка</a>
    </div>

    <div class="page-title">Запустить рулоны в печать</div>
    <div class="rolls-grid" id="printList">
        <div style="text-align: center; padding: 40px 0; color: #999;">Загрузка рулонов...</div>
    </div>
    <button class="btn-refresh" onclick="loadPrintRolls()">Обновить</button>
</div>

<script>
    const SUPABASE_URL = 'https://knuqfyjdptkkdapivsnm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_6k1bwNvlNAjNYI9NrijXtg_clTUDrOJ';
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type) {
        var el = document.getElementById('message');
        el.textContent = text;
        el.className = 'msg show ' + type;
        setTimeout(function() { el.classList.remove('show'); }, 5000);
    }

    async function loadPrintRolls() {
        const container = document.getElementById('printList');
        container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Загрузка...</div>';

        // Загружаем все рулоны, которые находятся на этапе Печать
        const { data, error } = await supabaseClient
            .from('rolls')
            .select('*')
            .in('status', ['Ожидание', 'В работе']);

        if (error) {
            container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #c0392b;">Ошибка загрузки</div>';
            return;
        }
        if (!data || data.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #999;">Нет рулонов на печати</div>';
            return;
        }

        let html = '';
        data.forEach(item => {
            // Формат ID рулона: 1_01
            const rollId = `${item.order_number}_${String(item.roll_index).padStart(2, '0')}`;
            
            let statusClass = 'status-wait';
            let statusText = 'Ожидает';
            if (item.status === 'В работе') {
                statusClass = 'status-work';
                statusText = 'В работе';
            }

            html += `
                <div class="roll-row">
                    <div class="roll-col col-id">
                        <div class="label">№ заказа</div>
                        <div class="value">${item.order_number}</div>
                    </div>
                    <div class="roll-col col-roll">
                        <div class="label">ID рулона</div>
                        <div class="value">${rollId}</div>
                    </div>
                    <div class="roll-col col-blocks">
                        <div class="label">Кол-во блоков</div>
                        <div class="value">${item.blocks}</div>
                    </div>
                    <div class="roll-col col-status">
                        <div class="label">Статус</div>
                        <div class="value ${statusClass}">${statusText}</div>
                    </div>
                    <div class="roll-col col-actions">
                        <div class="label">&nbsp;</div>
                        ${item.status === 'Ожидание' 
                            ? `<button class="btn-green" onclick="updatePrintRoll('${item.id}', 'В работе')">Взять в работу</button>` 
                            : `<button class="btn-red" onclick="updatePrintRoll('${item.id}', 'Выполнено')">Завершить</button>`
                        }
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    async function updatePrintRoll(rollId, newStatus) {
        // Получаем данные рулона
        const { data: rollData, error: getError } = await supabaseClient
            .from('rolls')
            .select('order_number, roll_index')
            .eq('id', rollId)
            .single();
        if (getError || !rollData) {
            showMessage('Ошибка получения рулона', 'err');
            return;
        }

        // Меняем статус рулона
        const { error: updateError } = await supabaseClient
            .from('rolls')
            .update({ status: newStatus })
            .eq('id', rollId);
        if (updateError) {
            showMessage('Ошибка обновления рулона', 'err');
            return;
        }

        // Если рулон завершён, он уходит на следующий этап (Каттер) отдельно
        if (newStatus === 'Выполнено') {
            await supabaseClient
                .from('stages')
                .insert([
                    { 
                        order_number: rollData.order_number, 
                        stage: 'Каттер', 
                        status: 'Ожидание',
                        shelf: `Р${rollData.roll_index}`
                    }
                ]);

            showMessage(`Рулон ${rollData.order_number}_${String(rollData.roll_index).padStart(2, '0')} переведён на Каттер`, 'ok');
        } else {
            showMessage('Рулон обновлён', 'ok');
        }

        loadPrintRolls();
    }

    document.addEventListener('DOMContentLoaded', loadPrintRolls);
</script>
</body>
</html>
